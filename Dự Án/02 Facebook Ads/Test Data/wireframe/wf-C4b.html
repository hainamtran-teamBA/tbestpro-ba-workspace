<title>Wireframe C4 · Săn bài win</title>
<style>

html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:2px;gap:2px}

.input{height:44px;border:1px solid var(--line2);border-radius:8px 0 0 8px;padding:0 12px;background:#fff;min-width:0;width:100%}

.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.main{padding:20px 32px 48px;display:flex;flex-direction:column;gap:12px}

.warn{margin:12px 16px 0;padding:8px 12px;border-radius:8px;background:#fbf3df;color:#5c4400;font-size:12px;display:flex;gap:8px;align-items:center}

.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--fill2);border-radius:0 0 10px 10px;min-height:49px}

.grid{display:grid;gap:12px}

.cover .d{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px;font-size:12px}
.cover .f{position:absolute;right:8px;top:8px;background:#fff;border-radius:4px;padding:1px 6px;font-size:12px;color:var(--ink)}
.cover .bl{position:absolute;left:8px;bottom:8px;background:#fff;border-radius:4px;padding:1px 6px;font-size:12px;color:var(--ink)}
.body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}

.vc .go{margin-top:auto;justify-content:center;height:32px;font-size:12px}

.win{background:var(--ink);color:#fff;border-color:var(--ink)}
.run{display:inline-flex;align-items:center;gap:4px}

.empty-box{padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

.o::before{content:"";width:10px;height:10px;border:1.5px solid #8a8a87;flex:none;box-sizing:border-box}

.o[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

.pop{position:absolute;left:0;top:36px;z-index:5;width:430px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:12px}

.mf{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}

.mf .btn-pri{min-width:170px;justify-content:center}

.mtop,.mbot{display:flex;align-items:center;gap:14px;padding:10px 20px}
.mtop{border-bottom:1px solid var(--line)} .mbot{border-top:1px solid var(--line)}
.mtop h3,.mbot h3{margin:0;font-size:13px;font-weight:700;min-width:48px}
.mbot .opts{gap:0}
.ddc .ddb{min-width:240px;height:34px;justify-content:space-between}
.ddc .fls{display:inline-flex;gap:4px;font-size:15px}
.lst .sec{font-size:11px;font-weight:600;color:var(--mute);padding:8px 6px 3px}
.modal.wide .row{display:block;padding:4px 0 8px}
.modal.wide .row .lab{display:block;margin-bottom:5px}
.seg .o{border-radius:0;margin-left:-1px}.seg .o:first-child{border-radius:8px 0 0 8px;margin-left:0}.seg .o:last-child{border-radius:0 8px 8px 0}

.modal.wide .col{padding:4px 16px 10px}

.ddc .ddp{width:300px}
.ddc .ddp .lst{max-height:300px;overflow:auto}
.mtop.two{display:grid;grid-template-columns:1fr 1fr;padding:0}

.mx{display:grid;grid-template-columns:1.3fr 1fr .8fr 1.15fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mx>div{padding:5px 5px 5px 6px;display:flex;flex-direction:column;gap:1px;min-width:0}

.mx span{font-size:11px;color:var(--mute);white-space:nowrap}

.ddc .fls{flex-wrap:wrap;max-width:230px;line-height:1.2}

.ctab{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-weight:500;font-size:13px;white-space:nowrap}

.pb{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--ink2);background:#fff}
.mx.mx1{grid-template-columns:1fr}
/* xếp hạng */
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--fill);color:var(--ink2)}

}
function modal(){
 const t=ST.tab,T=TABS[t],f=ST.dr,n=results(t,f).length;
 const al=(t==='video'&&T.fset)?T.fset[pfKey(t)]:null;const keepR=r=>!al||al.includes(r.id);
 const colsF=T.cols.map(c=>c.map(g=>g.t==='flag'?g:Object.assign({},g,{rows:g.rows.filter(keepR)})).filter(g=>g.t==='flag'||g.rows.length));
 const grp=g=>g.t==='flag'?flagRow(t):'<div class="grp"><h3>'+g.h+'</h3>'+g.rows.map(r=>'<div class="row"><span class="lab">'+r.lab+(r.tag?' <span class="tagg">'+r.tag+'</span>':'')+'</span><div class="opts">'+(r.t==='dd'?ddHtml(r.id,r.o,'Chọn'):r.o.map(o=>optBtn(r,o,f[r.id])).join(''))+'</div></div>').join('')+'</div>';
 return '<div class="scrim" data-act="close"><div class="modal'+(t==='video'||t==='ads'?' wide':'')+'" role="dialog" aria-modal="true" aria-label="Bộ lọc '+T.name+'">'+
  '<div class="mh"><b>Bộ lọc · '+T.name+'</b>'+(nActive(f)?'<span class="count">'+nActive(f)+'</span>':'')+'<span class="sp"></span><span class="small mute">○ chọn một · ☐ chọn nhiều</span><button type="button" class="btn btn-sm btn-ghost" data-act="close" aria-label="Đóng">'+ic('x')+'</button></div>'+
  '<div class="mq"><span class="lb">Mẫu lọc của team</span>'+T.presets.map((q,i)=>'<button type="button" class="qk" data-q="'+i+'" aria-pressed="'+presetOn(f,q[1])+'">'+q[0]+'</button>').join('')+'<button type="button" class="more" title="Team tự đặt tên chip lọc nhanh">+ Thêm chip</button><span class="sub">Chip lọc nhanh: bấm một chip, các ô bên dưới tự được chọn theo.'+(T.presetSub?' '+T.presetSub+'.':'')+'</span></div>'+
  topBand(t,f,al)+'<div class="mb" style="--n:'+colsF.map(c=>c.filter(g=>g.t!=='flag')).filter(c=>c.length).length+'">'+colsF.map(c=>c.filter(g=>g.t!=='flag')).filter(c=>c.length).map(c=>'<div class="col">'+c.map(grp).join('')+'</div>').join('')+'</div>'+
  '<div class="mf"><span class="note">'+T.note+'</span><button type="button" class="btn" data-act="resetdr">'+ic('reset')+'Đặt lại</button><button type="button" class="btn btn-pri" data-act="apply">Xem '+n+' kết quả</button></div></div></div>';
}
/* xếp hạng */
function rankDef(){
 const t=ST.tab,per=ST.view==='week'?7:30;
 if(t==='video'){
  const crit=['Nước: TH, MY, ID','Xem từ 300k','Kênh dưới 200k','Đăng trong 90 ngày','Loại kênh PH, tích xanh'];if(ST.strict)crit.push('Lượt xem từ 30 triệu');
  const rows=TT2.filter(v=>v.ng<=per&&PRI.includes(v.n)&&v.xem>=3e5&&v.f<2e5&&v.ng<=90&&!v.tx&&(!ST.strict||v.xem>=3e7)).sort((a,b)=>b.xem-a.xem);
  return {crit,how:'Xếp theo lượt xem.',rows,cols:['Video','Nước','Ngày đăng','Follow','Thích','Lượt xem'],
   cell:v=>['<div class="ch"><span class="th"></span><div style="min-width:0"><div class="ch"><span class="cn">'+esc(v.k)+'</span>'+tick(v.tx)+'</div><div class="small mute trunc">@'+esc(v.h)+' · '+esc(v.mo||'(không có mô tả)')+'</div></div></div>',flagOf(v.n)+' '+cname(v.n),ago(v.ng),num(v.f),num(v.thich)],
   score:v=>v.xem,fmt:s=>num(s),link:'Mở link gốc'};
 }
 if(t==='ads'){
  const rows=FB.filter(v=>v.act&&v.days>=30&&v.cp>=5).sort((a,b)=>b.days*b.cp-a.days*a.cp);
  return {crit:['Chạy từ 30 ngày','Từ 5 bản cùng nội dung','Đang chạy'],how:'Xếp theo số ngày chạy × số bản cùng nội dung (ước đoán). Chưa lọc theo kỳ: dữ liệu chỉ có ngày bắt đầu, kết thúc.',rows,cols:['Quảng cáo','Nước','Loại','Ngày chạy','Số bản','Điểm (ước đoán)'],
   cell:v=>['<div class="ch"><span class="th" style="height:36px"></span><div style="min-width:0"><div class="cn">'+esc(v.p)+'</div><div class="small mute trunc">'+esc(v.t||v.bd)+'</div></div></div>',flagOf(v.mk)+' '+cname(v.mk),FMTN[fmtOf(v.fmt)],v.days,v.cp],
   score:v=>v.days*v.cp,fmt:num,link:'Mở thư viện quảng cáo'};
 }
 const rows=SP.filter(v=>v.so>=5e3&&v.r>=4.5).sort((a,b)=>b.so*b.r-a.so*a.r);
 return {crit:['Đã bán từ 5k','Đánh giá từ 4,5'],how:'Xếp theo đã bán × đánh giá. Chưa lọc theo kỳ: dữ liệu chưa có ngày.',rows,cols:['Sản phẩm','Cửa hàng','Giá','Giảm','Đã bán','Đánh giá'],
  cell:v=>['<div class="ch"><span class="th" style="height:36px"></span><div class="trunc" style="max-width:380px">'+esc(v.t)+'</div></div>',esc(v.sh),String(v.pr).replace('.',',')+' PHP',disc(v)?'−'+disc(v)+'%':'—',num(v.so),'★ '+String(v.r).replace('.',',')],
  score:v=>v.so*v.r,fmt:num,link:null};
}
function rank(){
 const D=rankDef(),rows=D.rows.slice(0,10),per=ST.view==='week'?'tuần':'tháng';
 let h='<main class="main"><section class="card">'+head()+
  '<div class="rh" style="border-top:1px solid var(--line);margin-top:12px"><div class="r1"><h1 style="font-size:16px">Xếp hạng '+per+' · '+TABS[ST.tab].name+'</h1><span class="mute">'+(per==='tuần'?'13/11 – 19/11/2026':'21/10 – 19/11/2026')+'</span></div>'+
  '<div class="crits"><span class="lb">Tiêu chí xếp hạng</span>'+D.crit.map(c=>'<span class="cc">'+c+'</span>').join('')+'<span class="small mute">team chọn</span><span style="flex:1"></span><button type="button" class="btn btn-sm">'+ic('sliders')+'Sửa tiêu chí</button></div>'+
  '<p class="small mute" style="margin:0">'+D.how+'</p></div></section>';
 if(!rows.length){
  h+='<div class="card empty-box">'+ic('inbox')+'<h2>Chưa có '+TABS[ST.tab].unit+' đạt tiêu chí trong '+per+' này</h2><p>Các tiêu chí team chọn đang chặt hơn dữ liệu hiện có. Nới bớt một tiêu chí hoặc xem khoảng dài hơn.</p><div style="display:flex;gap:8px"><button type="button" class="btn" data-act="loose">Nới tiêu chí</button>'+(per==='tuần'?'<button type="button" class="btn" data-view="month">Xem theo tháng</button>':'')+'</div></div>';
 }else{
  const mx=D.score(rows[0]);
  h+='<div class="card"><table><thead><tr><th style="width:56px">Hạng</th>'+D.cols.map((c,i)=>'<th'+(i>=3?' class="r"':'')+'>'+c+'</th>').join('')+(D.link?'<th class="r" style="width:200px"></th>':'')+'</tr></thead><tbody>'+
   rows.map((v,i)=>{const c=D.cell(v);const last=D.cols.length===6&&ST.tab!=='prod';
    return '<tr><td><span class="medal'+(i<3?' m'+(i+1):'')+'">'+(i+1)+'</span></td>'+c.map((x,j)=>'<td'+(j>=3?' class="r"':'')+'>'+x+'</td>').join('')+
    (ST.tab!=='prod'?'<td class="r"><div class="barx"><span class="tr"><i style="width:'+Math.max(4,Math.round(D.score(v)/mx*100))+'%"></i></span><b style="min-width:44px">'+D.fmt(D.score(v))+'</b></div></td>':'')+
    (D.link?'<td class="r"><button type="button" class="btn btn-sm btn-ghost">'+ic('ext')+D.link+'</button></td>':'')+'</tr>'}).join('')+'</tbody></table></div>'+
   (rows.length<10?'<p class="small mute" style="margin:0">Chỉ '+rows.length+' kết quả đạt tiêu chí (số thật từ dữ liệu bản v5).</p>':'');
 }
 return h+'</main>';
}
function draw(){ if(ST.open&&ST.view==='feed')ST.ap[ST.tab]=clone(ST.dr); document.getElementById('app').innerHTML=wfbar()+topbar()+(ST.view==='feed'?feed():rank())+(ST.view==='feed'&&ST.open?modal():'');
}
function applyPreset(i){ST.dr=clone(TABS[ST.tab].presets[i][1]);}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,.scrim');if(!b)return;
 if(b.classList.contains('scrim')&&e.target!==b)return;
 const d=b.dataset;
 if(d.st){setState(+d.st);try{history.replaceState(null,'','?tt='+d.st)}catch(x){}draw();return}
 ST.n=0;
 if(d.tab){ST.tab=d.tab;ST.open=false;ST.more=false;draw();return}
 if(d.view){ST.view=d.view;ST.open=false;draw();return}
 if(d.pf){ST.pf[ST.tab]=+d.pf;draw();return}
 if(d.sort){ST.sort[ST.tab]=+d.sort;ST.best=false;draw();return}
 if(d.rm){delete ST.ap[ST.tab][d.rm];draw();return}
 if(d.q){applyPreset(+d.q);ST.dd=null;draw();return}
 if(d.dd){ST.dd=ST.dd===d.dd?null:d.dd;draw();return}
 if(d.k){const f=ST.dr,v=isNaN(+d.v)?d.v:+d.v;
  if(d.t==='r')f[d.k]=f[d.k]===v?undefined:v;else{const a=f[d.k]||[];f[d.k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}
  if(!isOn(f[d.k]))delete f[d.k];draw();return}
 const a=d.act;
 if(a==='open'){ST.dr=clone(ST.ap[ST.tab]);ST.open=true;ST.dd=null;draw();return}
 if(a==='close'){ST.open=false;ST.dd=null;draw();return}
 if(a==='pfmore'){ST.more=!ST.more;draw();return}
 if(a==='best'){ST.best=!ST.best;draw();return}
 if(a==='resetdr'){ST.dr={};draw();return}
 if(a==='resetap'){ST.ap[ST.tab]={};draw();return}
 if(a==='apply'){ST.ap[ST.tab]=clone(ST.dr);ST.open=false;ST.dd=null;draw();return}
 if(a==='loose'){ST.strict=false;draw();return}
});
document.addEventListener('change',e=>{const x=e.target;if(!x.dataset||!x.dataset.ck)return;const k=x.dataset.ck,v=x.dataset.v;const a=ST.dr[k]||[];ST.dr[k]=x.checked?[...a,v]:a.filter(y=>y!==v);if(!ST.dr[k].length)delete ST.dr[k];ST.n=0;draw()});
document.addEventListener('input',e=>{const x=e.target;if(!x.hasAttribute||!x.hasAttribute('data-filter'))return;const q=x.value.toLowerCase();x.parentNode.querySelectorAll('label').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ST.open){ST.open=false;ST.dd=null;draw()}});
(function(){let n=1;try{const p=new URLSearchParams(location.search);const t=+p.get('tt');if(t>=1&&t<=STATES.length)n=t;setState(n);
 const tab=p.get('tab');if(TABS[tab]){ST.tab=tab;ST.dr=clone(ST.ap[tab])}const v=p.get('view');if(['feed','week','month'].includes(v))ST.view=v;}catch(x){setState(1)}draw()})();

</script></body></html>
