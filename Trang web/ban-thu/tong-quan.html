<!doctype html>
<html lang="vi" data-theme="dark" data-palette="champagne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bàn dự án</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='4' fill='%23090A0C'/><rect x='5' y='5' width='6' height='6' rx='2' fill='none' stroke='%23D4C5B1' stroke-width='1.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Token: nền, chữ, viền (Smoked Obsidian / Alabaster) ===== */
:root{
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r-card:16px; --r-row:10px; --r-tag:6px;
}
:root[data-theme="dark"]{
  --bg:#090A0C; --sidebar:#0C0D10;
  --surface:rgba(22,24,29,.62); --surface-solid:#14161A; --raised:#1C1F25; --track:rgba(7,8,10,.72);
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.12);
  --text:#F3F4F6; --text-2:#9CA3AF; --text-3:#7A808C;
  --ok:#10B981; --warn:#F59E0B; --bad:#E5484D;
  --catch:rgba(255,255,255,.16);
  --card-shadow:0 20px 40px -15px rgba(0,0,0,.65),0 4px 12px -2px rgba(0,0,0,.4),inset 0 1px 0 0 var(--catch),inset 0 -1px 0 0 rgba(255,255,255,.03);
  --btn-bg:linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.04) 100%);
  --btn-shadow:0 4px 10px -2px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 0 rgba(255,255,255,.28),inset 0 -1px 0 0 rgba(0,0,0,.35);
  --btn-press:0 1px 3px rgba(0,0,0,.4),inset 0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 0 rgba(255,255,255,.08);
  --track-shadow:inset 0 2px 5px rgba(0,0,0,.65),inset 0 0 0 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07);
  --noise:.028;
}
:root[data-theme="light"]{
  --bg:#ECEEF2; --sidebar:#E4E7EC;
  --surface:rgba(255,255,255,.68); --surface-solid:#F7F8FA; --raised:#FFFFFF; --track:rgba(17,20,26,.07);
  --line:rgba(17,20,26,.08); --line-strong:rgba(17,20,26,.14);
  --text:#11141A; --text-2:#4B5260; --text-3:#6B7280;
  --ok:#0F8A5F; --warn:#B45309; --bad:#C2333A;
  --catch:rgba(255,255,255,.95);
  --card-shadow:0 1px 2px rgba(17,20,26,.05),0 10px 28px -12px rgba(17,20,26,.14),inset 0 1px 0 0 var(--catch);
  --btn-bg:linear-gradient(180deg,#FFFFFF 0%,#F1F3F6 100%);
  --btn-shadow:0 1px 2px rgba(17,20,26,.08),0 2px 6px -2px rgba(17,20,26,.10),inset 0 1px 0 0 #fff,inset 0 -1px 0 0 rgba(17,20,26,.06);
  --btn-press:inset 0 2px 4px rgba(17,20,26,.14),inset 0 0 0 1px rgba(17,20,26,.06);
  --track-shadow:inset 0 2px 4px rgba(17,20,26,.10),inset 0 0 0 1px rgba(17,20,26,.05),0 1px 0 rgba(255,255,255,.9);
  --noise:.02;
}
/* ===== Bảng màu nhấn: chỉ đổi màu nhấn, không đổi nền ===== */
[data-theme="dark"][data-palette="champagne"]{--accent:#D4C5B1;--accent-soft:rgba(212,197,177,.16);--on-accent:#17140F}
[data-theme="light"][data-palette="champagne"]{--accent:#8A6F4D;--accent-soft:rgba(138,111,77,.14);--on-accent:#fff}
[data-theme="dark"][data-palette="reu"]{--accent:#A9B98E;--accent-soft:rgba(169,185,142,.16);--on-accent:#12150E}
[data-theme="light"][data-palette="reu"]{--accent:#566B3A;--accent-soft:rgba(86,107,58,.14);--on-accent:#fff}
[data-theme="dark"][data-palette="coban"]{--accent:#93ABDB;--accent-soft:rgba(147,171,219,.16);--on-accent:#0E1220}
[data-theme="light"][data-palette="coban"]{--accent:#34569A;--accent-soft:rgba(52,86,154,.13);--on-accent:#fff}
[data-theme="dark"][data-palette="hophach"]{--accent:#E2A66C;--accent-soft:rgba(226,166,108,.16);--on-accent:#1A1209}
[data-theme="light"][data-palette="hophach"]{--accent:#9C5418;--accent-soft:rgba(156,84,24,.13);--on-accent:#fff}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease),color .3s var(--ease)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Ánh sáng nền: một vệt champagne rất mờ ở góc trên */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 520px at 78% -8%,var(--accent-soft),transparent 70%);opacity:.38}
/* Hạt nhám nhôm */
.grain{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:var(--noise);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ===== Khung trang ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px;background:var(--sidebar);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--btn-bg);box-shadow:var(--btn-shadow);border:1px solid var(--line-strong)}
.brand-mark span{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--accent)}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-row);color:var(--text-2);text-decoration:none;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav a:hover{color:var(--text);background:var(--track)}
.nav a.on{color:var(--text);background:var(--raised);box-shadow:inset 0 1px 0 0 var(--catch),0 0 0 1px var(--line)}
.nav a.off{cursor:default;opacity:.55}
.nav a.off:hover{background:none;color:var(--text-2)}
.nav .soon{margin-left:auto;font-size:12px;color:var(--text-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side-label{font-size:12px;color:var(--text-3);padding:0 8px}

/* Rãnh âm */
.track{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--track);box-shadow:var(--track-shadow)}
.track button{flex:1;height:28px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.track button:hover{color:var(--text)}
.track button[aria-pressed="true"]{color:var(--text);background:var(--btn-bg);box-shadow:var(--btn-shadow)}
.swatches button{flex:none;width:34px;padding:0}
.sw{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

/* ===== Nội dung chính ===== */
.main{padding:32px 32px 48px;max-width:1440px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.head h1{font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
.head .sub{margin-top:6px;color:var(--text-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-tag);font-size:12px;color:var(--text-2);background:var(--track);box-shadow:inset 0 0 0 1px var(--line)}
.head-actions{display:flex;gap:8px}

/* Nút kính */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-row);background:var(--btn-bg);border:1px solid var(--line-strong);box-shadow:var(--btn-shadow);color:var(--text);font-size:13px;font-weight:500;transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.btn::before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);pointer-events:none}
:root[data-theme="light"] .btn::before{display:none}
.btn:active{transform:translateY(1.5px) scale(.985);box-shadow:var(--btn-press)}
.btn .i{color:var(--text-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 18px -6px rgba(0,0,0,.5),inset 0 1px 0 0 rgba(255,255,255,.35),inset 0 -1px 0 0 rgba(0,0,0,.25)}
.btn.primary .i{color:var(--on-accent)}
kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:1px 5px;border-radius:4px;background:var(--track);box-shadow:inset 0 0 0 1px var(--line)}

/* Thẻ kính */
.card{background:var(--surface);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--card-shadow)}

/* Dải chỉ số */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:16px 20px}
.stat .k{color:var(--text-2);font-size:13px}
.stat .v{margin-top:8px;font-size:28px;line-height:32px;font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:14px;color:var(--text-3);font-weight:400;letter-spacing:0}
.stat .n{margin-top:6px;font-size:12px;color:var(--text-3)}

/* Lưới hai cột */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.panel-head h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
.panel-head .meta{font-size:12px;color:var(--text-3)}

/* Danh sách dự án */
.projects{padding:0 8px 8px}
.proj{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 132px;gap:24px;align-items:center;width:100%;text-align:left;padding:16px 12px;border-radius:12px;transition:background-color .18s var(--ease)}
.proj+.proj{border-top:1px solid var(--line)}
.proj:hover{background:var(--track)}
.proj:hover+.proj,.proj:hover{border-top-color:transparent}
.proj-name{display:flex;align-items:center;gap:10px}
.proj-name b{font-weight:500;font-size:15px}
.code{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:1px 6px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.proj-goal{margin-top:4px;color:var(--text-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-next{margin-top:10px;font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center;min-width:0}
.proj-next .i{color:var(--text-3)}
.proj-next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-next em{font-style:normal;color:var(--text-3);font-family:var(--mono);font-size:12px;flex:none}

/* Thanh cổng: điểm nhấn của trang */
.gates{display:flex;flex-direction:column;gap:8px}
.gate-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;border-radius:8px;background:var(--track);box-shadow:var(--track-shadow)}
.seg{height:8px;border-radius:4px;background:transparent;position:relative;overflow:hidden}
.seg.done{background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.seg.now{background:var(--accent-soft)}
.seg.now i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.75;border-radius:4px;width:var(--p);transform-origin:left;animation:fill .9s var(--ease) both .25s}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gate-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3)}
.gate-text b{font-weight:500;color:var(--text)}

.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);justify-self:end}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.run{background:var(--accent)}
.upd{display:block;margin-top:6px;font-size:12px;color:var(--text-3);text-align:right}
.status-wrap{justify-self:end;text-align:right}

/* Cột phải */
.stack{display:flex;flex-direction:column;gap:24px}
.list{padding:0 8px 8px}
.task{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-row);transition:background-color .15s var(--ease)}
.task:hover{background:var(--track)}
.check{flex:none;margin-top:1px;width:18px;height:18px;border-radius:6px;background:var(--track);box-shadow:var(--track-shadow);display:grid;place-items:center;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.check svg{width:12px;height:12px;stroke:var(--on-accent);stroke-width:2.2;fill:none;opacity:0;transform:scale(.6);transition:opacity .18s var(--ease),transform .18s var(--ease)}
.task.done .check{background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.3)}
.task.done .check svg{opacity:1;transform:none}
.task .t{flex:1;min-width:0}
.task .t p{font-size:14px;transition:color .2s var(--ease)}
.task.done .t p{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.task .t small{display:flex;gap:8px;margin-top:2px;font-size:12px;color:var(--text-3)}
.progress-line{margin:0 20px 8px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--ease)}

.decision{padding:12px;border-radius:var(--r-row)}
.decision+.decision{border-top:1px solid var(--line)}
.decision p{font-size:14px}
.decision small{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--text-3)}
.decision .wait{margin-left:auto;font-family:var(--mono);color:var(--warn)}

/* Ngăn kéo chi tiết */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
:root[data-theme="light"] .scrim{background:rgba(17,20,26,.18)}
.drawer{position:fixed;z-index:50;top:12px;right:12px;bottom:12px;width:440px;max-width:calc(100% - 24px);display:flex;flex-direction:column;border-radius:20px;background:var(--surface);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--line-strong);box-shadow:var(--card-shadow);transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease)}
:root[data-theme="dark"] .drawer{background:rgba(18,20,24,.86)}
:root[data-theme="light"] .drawer{background:rgba(247,248,250,.92)}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 16px;border-bottom:1px solid var(--line)}
.d-head h3{font-size:20px;line-height:26px;font-weight:500;letter-spacing:-.01em;margin-top:8px}
.d-body{padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:24px}
.d-sec h4{font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:8px}
.d-sec p{color:var(--text-2)}
.gate-steps{display:flex;flex-direction:column;gap:2px}
.gate-steps div{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--text-3);font-size:13px}
.gate-steps div.done{color:var(--text-2)}
.gate-steps div.now{color:var(--text);background:var(--raised);box-shadow:inset 0 1px 0 0 var(--catch),0 0 0 1px var(--line)}
.gate-steps .mk{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.gate-steps .done .mk{background:var(--accent);box-shadow:none}
.gate-steps .now .mk{box-shadow:inset 0 0 0 2px var(--accent)}
.gate-steps .when{margin-left:auto;font-family:var(--mono);font-size:12px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:var(--r-row);color:var(--text);text-decoration:none;background:var(--track);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.links a .i{color:var(--text-3)}
.links a span{margin-left:auto;color:var(--text-3);font-size:12px}
.icon-btn{width:32px;height:32px;padding:0;justify-content:center}

/* Viên thông báo kiểu Dynamic Island */
.island{position:fixed;z-index:80;top:16px;left:50%;transform:translate(-50%,-200%);display:flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 14px;border-radius:999px;background:rgba(14,15,18,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);color:#F3F4F6;font-size:13px;opacity:0;transition:transform .45s var(--ease),opacity .3s var(--ease)}
.island.show{transform:translate(-50%,0);opacity:1}
.island .dot{background:var(--ok);box-shadow:0 0 8px rgba(16,185,129,.5)}
.island time{font-family:var(--mono);font-size:12px;color:#9CA3AF}

/* Xuất hiện phân tầng */
.rise{opacity:0;transform:translateY(12px) scale(.985);filter:blur(4px);animation:rise .5s var(--ease) forwards;animation-delay:calc(var(--d,0) * 50ms)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none;filter:none}.seg.now i{animation:none}}

/* Màn nhỏ: chưa tối ưu, chỉ không vỡ */
@media (max-width:1180px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto}.nav a{flex:none}.nav .soon{display:none}
  .side-foot{margin:0;flex-direction:row;width:100%}.side-label{display:none}
  .main{padding:20px 16px 40px}
  .proj{grid-template-columns:1fr;gap:12px}.status-wrap{justify-self:start;text-align:left}.upd{text-align:left}
  .head{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="grain"></div>

  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 0-5-5L14 2z"/><path d="M3 21l6-6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark"><span></span></div><b>Bàn dự án</b></div>
    <nav class="nav">
      <a href="#" class="on"><svg class="i"><use href="#i-grid"/></svg>Tổng quan</a>
      <a class="off"><svg class="i"><use href="#i-folder"/></svg>Dự án<span class="soon">sau</span></a>
      <a class="off"><svg class="i"><use href="#i-book"/></svg>Tri thức<span class="soon">sau</span></a>
      <a class="off"><svg class="i"><use href="#i-note"/></svg>Nhật ký<span class="soon">sau</span></a>
      <a class="off"><svg class="i"><use href="#i-tool"/></svg>Bộ công cụ<span class="soon">sau</span></a>
    </nav>
    <div class="side-foot">
      <div class="side-label">Màu nhấn</div>
      <div class="track swatches" id="palette">
        <button data-p="champagne" title="Champagne"><span class="sw" style="background:#D4C5B1"></span></button>
        <button data-p="reu" title="Rêu"><span class="sw" style="background:#A9B98E"></span></button>
        <button data-p="coban" title="Cô-ban"><span class="sw" style="background:#93ABDB"></span></button>
        <button data-p="hophach" title="Hổ phách"><span class="sw" style="background:#E2A66C"></span></button>
      </div>
      <div class="track" id="theme">
        <button data-t="dark"><svg class="i"><use href="#i-moon"/></svg>Tối</button>
        <button data-t="light"><svg class="i"><use href="#i-sun"/></svg>Sáng</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="head rise" style="--d:0">
      <div>
        <h1>Tổng quan</h1>
        <div class="sub"><span id="today">Thứ Sáu, 14/11/2026</span><span class="tag">Dữ liệu mẫu</span></div>
      </div>
      <div class="head-actions">
        <button class="btn" data-say="Tìm kiếm có ở bản sau"><svg class="i"><use href="#i-search"/></svg>Tìm<kbd>⌘K</kbd></button>
        <button class="btn primary" data-say="Thêm dự án: nhờ Claude tạo"><svg class="i"><use href="#i-plus"/></svg>Dự án mới</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid">
      <section class="card rise" style="--d:5">
        <div class="panel-head">
          <h2>Dự án</h2>
          <div class="track" id="filter" style="width:300px">
            <button data-f="all" aria-pressed="true">Tất cả</button>
            <button data-f="run">Đang chạy</button>
            <button data-f="attn">Cần chú ý</button>
          </div>
        </div>
        <div class="projects" id="projects"></div>
      </section>

      <div class="stack">
        <section class="card rise" style="--d:6">
          <div class="panel-head"><h2>Tuần này</h2><span class="meta num" id="week-count"></span></div>
          <div class="progress-line"><i id="week-bar"></i></div>
          <div class="list" id="tasks"></div>
        </section>
        <section class="card rise" style="--d:7">
          <div class="panel-head"><h2>Chờ quyết định</h2><span class="meta" id="dec-count"></span></div>
          <div class="list" id="decisions"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head">
    <div><span class="code" id="d-code"></span><h3 id="d-name"></h3></div>
    <button class="btn icon-btn" id="d-close" aria-label="Đóng"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<div class="island" id="island"><span class="dot"></span><span id="island-text"></span><time id="island-time"></time></div>

<script>
/* ===== Dữ liệu mẫu (không phải số liệu thật) ===== */
const GATES=['Đề bài','Khảo sát','Giải pháp','Thử nghiệm','Triển khai'];
const STATUS={run:['run','Đang làm'],test:['ok','Đang thử'],wait:['warn','Chờ quyết định'],block:['bad','Bị chặn']};
const PROJECTS=[
 {id:'KHO',name:'Kho real-time',goal:'Biết tồn kho đúng từng bao, ngay khi hàng ra vào',gate:2,p:60,st:'run',next:'Chạy thử luồng cân mới với thủ kho',due:'18/11',upd:'Hôm nay',
  risk:'Chưa có số đo thất thoát hiện tại để so trước và sau',dates:['20/10','02/11','—','—','—'],
  docs:[['Bản đồ nghiệp vụ kho','Trang'],['Đặc tả nhập kho','Docs'],['Ma trận phân quyền','Trang']]},
 {id:'ADS',name:'Facebook Ads',goal:'Tự gom số liệu quảng cáo, báo cáo theo đội và bài đăng',gate:1,p:80,st:'wait',next:'Chọn cách lấy số liệu quảng cáo',due:'20/11',upd:'2 ngày trước',
  risk:'Phạm vi dễ phình: báo cáo, thư viện nội dung, đối soát cùng lúc',dates:['27/10','—','—','—','—'],
  docs:[['Quy trình hiện tại','Trang'],['Đề xuất trợ lý báo cáo','Trang']]},
 {id:'SMS',name:'SMS tự động',goal:'Gửi tin hàng loạt qua cổng SIM, thử ở Philippines',gate:3,p:30,st:'test',next:'Gửi tin thử tới nhóm telesale',due:'17/11',upd:'Hôm qua',
  risk:'Nhà mạng giới hạn số tin mỗi SIM; cần đăng ký SIM',dates:['05/11','09/11','12/11','—','—'],
  docs:[['Báo cáo SMS','Trang'],['Tin nhắn mời thử','Ghi chú']]},
 {id:'CBC',name:'Cổng báo cáo nội bộ',goal:'Một chỗ để cả đội nộp báo cáo và đính kèm file',gate:3,p:15,st:'block',next:'Chờ chỗ chạy máy chủ nội bộ',due:'—',upd:'6 ngày trước',
  risk:'Không ai dùng nếu vẫn quen gửi qua tin nhắn',dates:['21/10','24/10','29/10','—','—'],
  docs:[['Bản chạy thử','Trang']]},
];
const TASKS=[
 {t:'Chạy thử luồng cân mới với thủ kho',p:'KHO',d:'T2',done:false},
 {t:'Gửi tin nhắn mời thử SMS cho nhóm telesale',p:'SMS',d:'T2',done:true},
 {t:'Soạn 3 phương án lấy số liệu quảng cáo',p:'ADS',d:'T3',done:false},
 {t:'Chốt ma trận phân quyền Kho 7',p:'KHO',d:'T4',done:true},
 {t:'Hỏi IT chỗ đặt máy chủ cổng báo cáo',p:'CBC',d:'T5',done:false},
];
const DECISIONS=[
 {q:'Sửa phần mềm kho hiện có hay tự xây',who:'Ban Giám đốc',p:'KHO',wait:'5 ngày'},
 {q:'Lấy số liệu quảng cáo bằng công cụ tự động hay trợ lý AI',who:'Trưởng IT',p:'ADS',wait:'2 ngày'},
];

const $=s=>document.querySelector(s);
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;

/* Dải chỉ số */
function renderStats(){
  const done=TASKS.filter(t=>t.done).length;
  const items=[
    ['Dự án đang chạy',PROJECTS.length,'','2 đang làm, 1 đang thử'],
    ['Việc tuần này',done,`/ ${TASKS.length}`,'Còn '+(TASKS.length-done)+' việc đến Thứ Sáu'],
    ['Chờ quyết định',DECISIONS.length,'','Lâu nhất 5 ngày'],
    ['Bị chặn',PROJECTS.filter(p=>p.st==='block').length,'','Cổng báo cáo nội bộ'],
  ];
  $('#stats').innerHTML=items.map((s,i)=>`<div class="card stat rise" style="--d:${i+1}"><div class="k">${s[0]}</div><div class="v">${s[1]} <small>${s[2]}</small></div><div class="n">${s[3]}</div></div>`).join('');
}

/* Thanh cổng */
function gateBar(p){
  return `<div class="gates"><div class="gate-bar">${GATES.map((g,i)=>`<div class="seg ${i<p.gate?'done':i===p.gate?'now':''}">${i===p.gate?`<i style="--p:${p.p}%"></i>`:''}</div>`).join('')}</div>
  <div class="gate-text"><span>Cổng <b>${GATES[p.gate]}</b></span><span class="num">${p.gate+1}/5</span></div></div>`;
}

let filter='all';
function renderProjects(){
  const list=PROJECTS.filter(p=>filter==='all'||(filter==='run'?['run','test'].includes(p.st):['wait','block'].includes(p.st)));
  $('#projects').innerHTML=list.map(p=>{const [c,l]=STATUS[p.st];return `
  <button class="proj" data-id="${p.id}">
    <div style="min-width:0">
      <div class="proj-name"><b>${p.name}</b><span class="code">${p.id}</span></div>
      <div class="proj-goal">${p.goal}</div>
      <div class="proj-next">${ico('arrow')}<span>${p.next}</span><em>${p.due}</em></div>
    </div>
    ${gateBar(p)}
    <div class="status-wrap"><span class="status"><span class="dot ${c}"></span>${l}</span><span class="upd">${p.upd}</span></div>
  </button>`}).join('')||`<p style="padding:24px 12px;color:var(--text-3)">Không có dự án nào ở nhóm này</p>`;
}

function renderTasks(){
  const done=TASKS.filter(t=>t.done).length;
  $('#week-count').textContent=`${done}/${TASKS.length} xong`;
  $('#week-bar').style.width=(done/TASKS.length*100)+'%';
  $('#tasks').innerHTML=TASKS.map((t,i)=>`<button class="task ${t.done?'done':''}" data-i="${i}">
    <span class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="t"><p>${t.t}</p><small><span class="mono">${t.p}</span><span>${t.d}</span></small></span></button>`).join('');
}

function renderDecisions(){
  $('#dec-count').textContent=DECISIONS.length+' việc';
  $('#decisions').innerHTML=DECISIONS.map(d=>`<div class="decision"><p>${d.q}</p><small><span class="mono">${d.p}</span><span>${d.who}</span><span class="wait">${d.wait}</span></small></div>`).join('');
}

/* Ngăn kéo chi tiết */
function openDrawer(id){
  const p=PROJECTS.find(x=>x.id===id);const [c,l]=STATUS[p.st];
  $('#d-code').textContent=p.id;$('#d-name').textContent=p.name;
  $('#d-body').innerHTML=`
   <div class="d-sec"><span class="status" style="justify-self:start"><span class="dot ${c}"></span>${l} · cập nhật ${p.upd.toLowerCase()}</span><p style="margin-top:10px">${p.goal}</p></div>
   <div class="d-sec"><h4>Các cổng</h4><div class="gate-steps">${GATES.map((g,i)=>`<div class="${i<p.gate?'done':i===p.gate?'now':''}"><span class="mk"></span>${g}<span class="when">${i===p.gate?p.p+'%':p.dates[i]}</span></div>`).join('')}</div></div>
   <div class="d-sec"><h4>Việc tiếp theo</h4><p style="color:var(--text)">${p.next}</p><p style="font-size:12px;color:var(--text-3);margin-top:2px">Hạn <span class="num">${p.due}</span></p></div>
   <div class="d-sec"><h4>Rủi ro lớn nhất</h4><p>${p.risk}</p></div>
   <div class="d-sec"><h4>Tài liệu</h4><div class="links">${p.docs.map(d=>`<a href="#" data-say="Mở tài liệu có ở bản sau">${ico('file')}${d[0]}<span>${d[1]}</span></a>`).join('')}</div></div>`;
  document.body.classList.add('open');$('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){document.body.classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}

/* Viên thông báo */
let islandTimer;
function say(text){
  const t=new Date();$('#island-text').textContent=text;
  $('#island-time').textContent=t.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#island').classList.add('show');clearTimeout(islandTimer);islandTimer=setTimeout(()=>$('#island').classList.remove('show'),2200);
}

/* Giao diện: tối/sáng, màu nhấn (nhớ trong trình duyệt nếu được) */
function store(k,v){try{v===undefined?v=localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){v=null}return v}
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));store('bda-theme',t)}
function setPalette(p){document.documentElement.dataset.palette=p;document.querySelectorAll('#palette button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));store('bda-palette',p)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-say],.proj,.task,#filter button,#theme button,#palette button,#d-close,#scrim');if(!el)return;
  if(el.dataset.say){e.preventDefault();say(el.dataset.say);return}
  if(el.classList.contains('proj'))return openDrawer(el.dataset.id);
  if(el.classList.contains('task')){const t=TASKS[el.dataset.i];t.done=!t.done;renderTasks();renderStats();say(t.done?'Đã xong một việc':'Mở lại một việc');return}
  if(el.closest('#filter')){filter=el.dataset.f;document.querySelectorAll('#filter button').forEach(b=>b.setAttribute('aria-pressed',b===el));renderProjects();return}
  if(el.closest('#theme'))return setTheme(el.dataset.t);
  if(el.closest('#palette')){setPalette(el.dataset.p);return say('Đổi màu nhấn: '+el.title)}
  if(el.id==='d-close'||el.id==='scrim')closeDrawer();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();say('Tìm kiếm có ở bản sau')}});

const d=new Date();const days=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
$('#today').textContent=`${days[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
setTheme(store('bda-theme')||'dark');setPalette(store('bda-palette')||'champagne');
renderStats();renderProjects();renderTasks();renderDecisions();
</script>
</body>
</html>
