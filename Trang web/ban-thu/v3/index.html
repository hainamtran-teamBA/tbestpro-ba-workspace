<!doctype html>
<!-- Bàn dự án v3: mở thẳng file này bằng trình duyệt (bấm đúp). Dữ liệu nằm trong data/ (file .js), không cần máy chủ. -->
<html lang="vi" data-theme="dark" data-palette="champagne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bàn dự án</title>
<script>/* Nền và màu nhấn đã chọn (đặt trước khi vẽ để không nháy) */
try{var t=localStorage.getItem('bda3-theme'),p=localStorage.getItem('bda3-palette');if(t)document.documentElement.dataset.theme=t;if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='4' fill='%23090A0C'/><rect x='5' y='5' width='6' height='6' rx='2' fill='none' stroke='%23D4C5B1' stroke-width='1.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(0.22,1,0.36,1);--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}

/* ===== Nền tối: kính khói trên căn phòng mờ ===== */
:root[data-theme="dark"]{
  --wall:#0A0A0C;
  --win:rgba(30,31,36,.46); --win-line:rgba(255,255,255,.10);
  --tile:rgba(9,10,12,.58); --tile-hover:rgba(14,15,18,.72); --tile-line:rgba(255,255,255,.07);
  --rail:rgba(22,23,27,.62);
  --track:rgba(0,0,0,.42);
  --text:#F3F4F6; --text-2:#B4B9C2; --text-3:#969CA6;
  --ok:#10B981; --warn:#F59E0B; --bad:#E5484D;
  --catch:rgba(255,255,255,.16);
  --win-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 10px 30px -10px rgba(0,0,0,.5),inset 0 1px 0 0 rgba(255,255,255,.14);
  --tile-shadow:inset 0 1px 0 0 rgba(255,255,255,.06),0 10px 24px -14px rgba(0,0,0,.6);
  --btn-bg:linear-gradient(180deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.05) 100%);
  --btn-shadow:0 4px 10px -2px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 0 rgba(255,255,255,.28),inset 0 -1px 0 0 rgba(0,0,0,.35);
  --btn-press:0 1px 3px rgba(0,0,0,.4),inset 0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 0 rgba(255,255,255,.08);
  --track-shadow:inset 0 2px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.06);
  --focus-bg:var(--ivory); --focus-text:#17140F; --focus-2:rgba(23,20,15,.62);
  --rim:rgba(255,255,255,.34); --rim2:rgba(255,255,255,.10);
}
/* ===== Nền sáng: kính sữa trên căn phòng ban ngày ===== */
:root[data-theme="light"]{
  --wall:#D9D6D1;
  --win:rgba(255,255,255,.42); --win-line:rgba(255,255,255,.75);
  --tile:rgba(255,255,255,.66); --tile-hover:rgba(255,255,255,.86); --tile-line:rgba(17,20,26,.06);
  --rail:rgba(255,255,255,.55);
  --track:rgba(17,20,26,.07);
  --text:#11141A; --text-2:#434A57; --text-3:#596070;
  --ok:#0F8A5F; --warn:#B45309; --bad:#C2333A;
  --catch:rgba(255,255,255,.95);
  --win-shadow:0 40px 80px -30px rgba(40,35,25,.35),0 10px 30px -12px rgba(40,35,25,.18),inset 0 1px 0 0 rgba(255,255,255,.9);
  --tile-shadow:0 1px 2px rgba(17,20,26,.05),inset 0 1px 0 0 #fff;
  --btn-bg:linear-gradient(180deg,#FFFFFF 0%,#F1F2F4 100%);
  --btn-shadow:0 1px 2px rgba(17,20,26,.08),0 3px 8px -3px rgba(17,20,26,.12),inset 0 1px 0 0 #fff,inset 0 -1px 0 0 rgba(17,20,26,.06);
  --btn-press:inset 0 2px 4px rgba(17,20,26,.14),inset 0 0 0 1px rgba(17,20,26,.06);
  --track-shadow:inset 0 2px 4px rgba(17,20,26,.10),inset 0 0 0 1px rgba(17,20,26,.04),0 1px 0 rgba(255,255,255,.9);
  --focus-bg:#17181C; --focus-text:#F3F4F6; --focus-2:rgba(243,244,246,.6);
  --rim:rgba(255,255,255,1); --rim2:rgba(255,255,255,.6);
}
/* ===== Màu nhấn (4 lựa chọn) ===== */
[data-palette="champagne"]{--ivory:#ECE4D6}
[data-palette="reu"]{--ivory:#E2E8D5}
[data-palette="coban"]{--ivory:#DEE5F2}
[data-palette="hophach"]{--ivory:#F2E3D0}
[data-theme="dark"][data-palette="champagne"]{--accent:#D4C5B1;--accent-soft:rgba(212,197,177,.18);--on-accent:#17140F;--lamp:rgba(225,185,135,.55)}
[data-theme="light"][data-palette="champagne"]{--accent:#8A6F4D;--accent-soft:rgba(138,111,77,.16);--on-accent:#fff;--lamp:rgba(255,236,205,.9)}
[data-theme="dark"][data-palette="reu"]{--accent:#A9B98E;--accent-soft:rgba(169,185,142,.18);--on-accent:#12150E;--lamp:rgba(175,195,140,.42)}
[data-theme="light"][data-palette="reu"]{--accent:#566B3A;--accent-soft:rgba(86,107,58,.15);--on-accent:#fff;--lamp:rgba(230,240,210,.9)}
[data-theme="dark"][data-palette="coban"]{--accent:#93ABDB;--accent-soft:rgba(147,171,219,.18);--on-accent:#0E1220;--lamp:rgba(135,165,225,.42)}
[data-theme="light"][data-palette="coban"]{--accent:#34569A;--accent-soft:rgba(52,86,154,.14);--on-accent:#fff;--lamp:rgba(215,228,250,.95)}
[data-theme="dark"][data-palette="hophach"]{--accent:#E2A66C;--accent-soft:rgba(226,166,108,.18);--on-accent:#1A1209;--lamp:rgba(235,160,90,.55)}
[data-theme="light"][data-palette="hophach"]{--accent:#9C5418;--accent-soft:rgba(156,84,24,.14);--on-accent:#fff;--lamp:rgba(255,225,190,.95)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wall);color:var(--text);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ===== Hình nền: căn phòng mờ (vẽ bằng CSS, không dùng ảnh) ===== */
.wall{position:fixed;inset:0;z-index:0;overflow:hidden;transition:background .5s var(--ease)}
.wall i{position:absolute;display:block;filter:blur(70px);transition:background .6s var(--ease),opacity .6s var(--ease)}
.wall .lamp{width:46vw;height:56vh;right:-6vw;top:-14vh;border-radius:50%;background:radial-gradient(closest-side,var(--lamp),transparent)}
.wall .window{width:22vw;height:70vh;right:9vw;top:8vh;border-radius:40px;opacity:.55}
:root[data-theme="dark"] .wall .window{background:linear-gradient(180deg,rgba(175,185,200,.32),rgba(90,95,110,.10));opacity:.9}
.wall .glow2{width:26vw;height:30vh;left:18vw;top:6vh;border-radius:50%;background:radial-gradient(closest-side,var(--lamp),transparent);opacity:.45}
:root[data-theme="light"] .wall .window{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.4))}
.wall .floor{left:-10vw;right:-10vw;bottom:-22vh;height:44vh;border-radius:50%}
:root[data-theme="dark"] .wall .floor{background:rgba(85,70,55,.45)}
:root[data-theme="light"] .wall .floor{background:rgba(170,150,125,.35)}
.wall .sofa{width:34vw;height:26vh;left:4vw;bottom:6vh;border-radius:60px}
:root[data-theme="dark"] .wall .sofa{background:rgba(120,105,90,.30)}
:root[data-theme="light"] .wall .sofa{background:rgba(150,140,128,.30)}
.wall .shade{inset:0;filter:none}
:root[data-theme="dark"] .wall .shade{background:radial-gradient(120% 90% at 60% 40%,transparent 40%,rgba(0,0,0,.65))}
:root[data-theme="light"] .wall .shade{background:radial-gradient(120% 90% at 60% 40%,transparent 50%,rgba(120,110,95,.18))}
.grain{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.03;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ===== Thanh icon dạng viên thuốc (bấm nút trên cùng để mở rộng) ===== */
.rail{position:fixed;z-index:30;left:24px;top:50%;transform:translateY(-50%);width:64px;padding:8px;border-radius:32px;display:flex;flex-direction:column;gap:6px;background:var(--rail);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--win-line);box-shadow:var(--win-shadow);transition:width .45s var(--ease),border-radius .45s var(--ease)}
.rail.wide{width:232px;border-radius:26px}
.r-btn{position:relative;display:flex;align-items:center;gap:12px;height:46px;width:100%;padding:0 13px;border-radius:23px;color:var(--text-2);white-space:nowrap;overflow:hidden;transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .14s var(--ease)}
.r-btn:hover{color:var(--text);background:var(--track)}
.r-btn:active{transform:scale(.97)}
.r-btn.on{color:var(--text);background:var(--btn-bg);box-shadow:var(--btn-shadow)}
.r-btn.off{opacity:.5}
.r-label{opacity:0;transform:translateX(-6px);transition:opacity .25s var(--ease),transform .3s var(--ease);font-size:14px}
.rail.wide .r-label{opacity:1;transform:none;transition-delay:.12s}
.r-btn .soon{margin-left:auto;font-size:12px;color:var(--text-3)}
.r-sep{height:1px;margin:4px 10px;background:var(--win-line)}
.r-tip{position:absolute;left:76px;top:50%;transform:translate(-4px,-50%);pointer-events:none;opacity:0;padding:6px 10px;border-radius:10px;font-size:12px;white-space:nowrap;background:rgba(14,15,18,.92);color:#F3F4F6;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);transition:opacity .16s var(--ease),transform .2s var(--ease)}
.rail:not(.wide) .r-wrap:hover .r-tip{opacity:1;transform:translate(0,-50%)}
.r-wrap{position:relative}
.swatches{display:none;gap:8px;padding:8px 13px 4px}
.rail.wide .swatches{display:flex}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3);transition:transform .15s var(--ease)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--wall),0 0 0 3.5px var(--text-2)}
.sw:hover{transform:scale(1.1)}

/* ===== Cửa sổ kính ===== */
.win{position:fixed;z-index:10;top:24px;bottom:24px;left:112px;right:24px;border-radius:30px;background:var(--win);backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid var(--win-line);box-shadow:var(--win-shadow);overflow:hidden;display:flex;flex-direction:column}
.win::before,.tile::before,.proj::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(155deg,var(--rim),transparent 32%,transparent 70%,var(--rim2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.win-scroll{flex:1;overflow:auto;padding:24px 28px 28px;scrollbar-width:thin;scrollbar-color:var(--track) transparent}
.inner{max-width:1360px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
@media (min-width:1181px) and (min-height:760px){.win-scroll{overflow:hidden}.inner{height:100%}}

/* Đầu trang */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:13px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;color:var(--text-2);background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line)}
.top-right{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:10px;height:44px;width:300px;padding:0 8px 0 16px;border-radius:22px;color:var(--text-2);background:var(--track);box-shadow:var(--track-shadow);font-size:14px}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-2);padding:3px 8px;border-radius:12px;background:var(--btn-bg);box-shadow:var(--btn-shadow)}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--btn-bg);box-shadow:var(--btn-shadow);border:1px solid var(--win-line);transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.circle:active,.pill:active,.chk:active{transform:translateY(1.5px) scale(.97);box-shadow:var(--btn-press)}
.avatar{font-size:13px;font-weight:500;color:var(--text)}

/* Khối chào: vòng tiến độ + số lớn */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:24px;align-items:end;margin-bottom:20px}
.hero-main{display:flex;align-items:center;gap:24px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--track);stroke-width:8;fill:none}
.ring .fg{stroke:var(--accent);stroke-width:8;fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring .ticks{stroke:var(--text-3);stroke-width:1;opacity:.5}
.ring-text{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-text b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.ring-text small{display:block;font-size:11px;color:var(--text-3);margin-top:2px}
.hero h1{font-size:34px;line-height:38px;font-weight:400;letter-spacing:-.03em}
.hero h1 span{color:var(--text-3)}
.big .k{font-size:13px;color:var(--text-2);margin-bottom:6px}
.big .v{font-size:46px;line-height:46px;font-weight:400;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big .v sup{font-size:16px;letter-spacing:0;color:var(--text-3);font-weight:400;vertical-align:top;margin-left:4px;position:relative;top:4px}
.big .n{margin-top:8px;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}

/* Lưới ô */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:16px 20px}
.grid>.col{grid-column:2;grid-row:1/3;min-height:0}
.grid>.wk{display:flex;flex-direction:column;min-height:0}
.tile{position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.035),transparent 45%);background-color:var(--tile);border:1px solid var(--tile-line);border-radius:24px;box-shadow:var(--tile-shadow)}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.t-head{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
.t-head h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
.t-head .meta{font-size:12px;color:var(--text-3)}

/* Chip lọc trong rãnh âm */
.track{display:flex;gap:2px;padding:3px;border-radius:20px;background:var(--track);box-shadow:var(--track-shadow)}
.pill{white-space:nowrap;height:30px;padding:0 14px;border-radius:15px;font-size:13px;color:var(--text-2);transition:color .15s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),transform .14s var(--ease)}
.pill:hover{color:var(--text)}
.pill[aria-pressed="true"]{color:var(--text);background:var(--btn-bg);box-shadow:var(--btn-shadow)}

/* Thẻ dự án 2x2 */
.projects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 12px 12px}
.proj{position:relative;text-align:left;border-radius:16px;background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line);transition:background .2s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);display:flex;flex-direction:column;gap:12px;padding:16px}
.proj:hover{background:var(--tile-hover);transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--win-line),0 16px 30px -18px rgba(0,0,0,.6)}
.p-top{display:flex;align-items:center;justify-content:space-between}
.code{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:2px 8px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--tile-line)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);white-space:nowrap;min-width:0}
.p-top{gap:8px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.run{background:var(--accent)}
.p-name{font-size:17px;line-height:22px;font-weight:500;letter-spacing:-.01em}
.p-goal{margin-top:4px;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.p-foot .gate-bar{margin-bottom:4px}
.gate-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;border-radius:8px;background:var(--track);box-shadow:var(--track-shadow)}
.seg{height:8px;border-radius:4px;position:relative;overflow:hidden}
.seg.done{background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.seg.now{background:var(--accent-soft)}
.seg.now i{position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--accent);opacity:.75;border-radius:4px;transform-origin:left;animation:fill .9s var(--ease) both .4s}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.p-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)}
.p-meta b{font-weight:500;color:var(--text)}
.p-next{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);min-width:0}
.p-next svg{width:15px;height:15px;color:var(--text-3)}
.p-next span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-next em{font-style:normal;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-3);flex:none;padding-left:8px}

/* Cột phải */
.col{display:flex;flex-direction:column;gap:16px}
.col>.tile{flex:1;min-height:0;overflow:auto}
.focus{flex:none;border-radius:24px;padding:22px;background:var(--focus-bg);color:var(--focus-text);box-shadow:0 20px 40px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);display:flex;flex-direction:column;gap:16px;min-height:236px;transition:background .5s var(--ease),color .5s var(--ease)}
:root[data-theme="light"] .focus{box-shadow:0 24px 40px -22px rgba(17,20,26,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.focus .f-k{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--focus-2)}
.focus .f-t{font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.02em}
.focus .f-m{font-size:13px;color:var(--focus-2)}
.focus .f-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.focus .f-big{font-size:40px;line-height:40px;font-weight:400;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.focus .f-big sup{font-size:13px;letter-spacing:0;vertical-align:top;position:relative;top:2px;margin-left:3px;color:var(--focus-2)}
.toggle2{display:flex;gap:2px;padding:3px;border-radius:22px;background:rgba(0,0,0,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
:root[data-theme="light"] .toggle2{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.toggle2 button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--focus-2);transition:background .2s var(--ease),color .2s var(--ease)}
.toggle2 button.yes{background:var(--focus-text);color:var(--focus-bg);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle2 svg{width:16px;height:16px}

.dec{padding:0 8px 10px}
.dec-row{padding:12px;border-radius:12px}
.dec-row+.dec-row{border-top:1px solid var(--tile-line)}
.dec-row p{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nolink{opacity:.5}
.oempty{padding:28px 24px}
.oempty b{display:block;font-size:16px;font-weight:500}
.oempty p{margin-top:6px;color:var(--text-2);max-width:560px}

/* Tài liệu đặc tả */
.dochead{padding:4px 0}
.dochead .kick{font-size:13px;color:var(--text-3)}
.dochead h1{font-size:30px;line-height:36px;font-weight:400;letter-spacing:-.025em;margin-top:4px}
.sec{padding:20px 24px 24px;scroll-margin-top:16px}
.sec:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead .n{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.sechead h2{font-size:18px;font-weight:500;letter-spacing:-.01em}
.sechead .note{font-size:12px;color:var(--text-2);margin-left:auto}
.lead{font-size:16px;line-height:24px;max-width:760px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.lbl{font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:8px}
.plain{list-style:none;display:flex;flex-direction:column;gap:6px}
.plain li{position:relative;padding-left:16px;font-size:14px}
.plain li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.plain.out li::before{background:none;box-shadow:inset 0 0 0 1.5px var(--text-3)}
.plain.out li{color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:13px;color:var(--text);background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line)}
.bmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bgrp{padding:12px;border-radius:16px;background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line);display:flex;flex-direction:column;gap:8px}
.bgh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px;font-size:14px}
.bgh b{font-weight:500}.bgh span{font-size:12px;color:var(--text-3)}
.ucc{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-line);transition:background .15s var(--ease),transform .2s var(--ease)}
.ucc:hover{background:var(--tile-hover);transform:translateY(-1px)}
.ucc.hot{box-shadow:inset 0 0 0 1.5px var(--warn)}
.ucc .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ucc .nm{font-size:14px;line-height:19px}
.ucc .who{font-size:12px;color:var(--text-3)}
.ust{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.ust i{width:7px;height:7px;border-radius:50%}
.ust.l-chot,.ust.l-duyet,.ust.l-viet,.ust.l-chua{background:none}
.ust.l-chot i{background:var(--ok)}.ust.l-duyet i{background:var(--warn)}.ust.l-viet i{background:var(--accent)}.ust.l-chua i{background:none;box-shadow:inset 0 0 0 1.5px var(--text-3)}
.tblwrap{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--tile-line)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;font-size:12px;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--tile-line);background:var(--track)}
.t td{padding:10px 12px;border-top:1px solid var(--tile-line);vertical-align:top;color:var(--text-2)}
.t tr:first-child td{border-top:0}
.t td.k,.t td.c1{color:var(--text)}
.t .id{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.uclink{display:inline-flex;gap:10px;color:var(--text)}
.uclink:hover{text-decoration:underline;text-decoration-color:var(--text-3)}
.uclink .mono,.mono{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.declist{display:flex;flex-direction:column}
.declist div{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;padding:10px 0;border-top:1px solid var(--tile-line);font-size:14px}
.declist div:first-child{border-top:0}
.declist .d{font-family:var(--mono);font-size:12px;color:var(--text-3);padding-top:1px}
.declist .by{font-size:12px;color:var(--text-3);white-space:nowrap}
.qlist{list-style:none;counter-reset:q;display:flex;flex-direction:column}
.qlist li{counter-increment:q;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--tile-line);font-size:14px}
.qlist li:first-child{border-top:0}
.qlist li::before{content:counter(q);font-family:var(--mono);font-size:12px;color:var(--text-3);padding-top:1px}
.qlist a{color:var(--text-3);font-size:12px;font-family:var(--mono)}
.gloss{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 18px;font-size:14px}
.gloss dt{font-weight:500}.gloss dd{color:var(--text-2)}

/* Trang use case */
.uclayout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.sum{position:sticky;top:0;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 152px);overflow:auto;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text-3) 35%,transparent) transparent}
.sum .code-l{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.sum h1{font-size:24px;line-height:30px;font-weight:400;letter-spacing:-.02em}
.sum .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 0;border-top:1px solid var(--tile-line);border-bottom:1px solid var(--tile-line)}
.sum .meta span,.sum .f>span{display:block;font-size:12px;color:var(--text-3);margin-bottom:2px}
.sum .meta b{font-weight:500;font-size:13px}
.sum .f div,.sum .f li{font-size:13px;line-height:19px}
.sum .f ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.sum .f li{padding-left:12px;position:relative}
.sum .f li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.sum .f.ok div{color:var(--text)}.sum .f.ok>span{color:var(--ok)}
.sum .f.bad>span{color:var(--bad)}
.ucmain{min-width:0;display:flex;flex-direction:column;gap:16px}
.tabs{overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.tabs .pill{height:36px;display:inline-flex;align-items:center;gap:6px}
.tabs .pill .c{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.part{padding:20px 24px 24px}
.part h2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:18px;font-weight:500;margin-bottom:14px}
.part h2 .x{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;font-weight:400}
.fig{border-radius:16px;overflow:auto;max-height:640px;background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line);cursor:zoom-in}
.fig img{display:block;width:100%;height:auto}
.fig[data-kind="activity"] img{min-width:1000px}
.fig[data-kind="state"] img{width:min(100%,260px);margin:16px auto}
.figcap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-3)}
.figcap a{display:inline-flex;align-items:center;gap:4px;color:var(--text-2)}
.figcap a svg{width:13px;height:13px}
.figmiss{padding:24px;font-size:13px;color:var(--text-3)}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.tg i{width:7px;height:7px;border-radius:50%;flex:none}
.part h2 .x .tg{margin-right:8px}
.t-chot i{background:var(--ok)}.t-de-xuat i{background:var(--accent)}.t-can-chot i{background:var(--warn)}.t-chua-co i{background:var(--bad)}
.ucsteps{list-style:none;display:flex;flex-direction:column}
.ucsteps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--tile-line)}
.ucsteps li:first-child{border-top:0}
.ucsteps .nb{font-family:var(--mono);font-size:12px;color:var(--text-3);padding-top:3px}
.ucsteps .top{display:flex;align-items:center;justify-content:flex-start;gap:8px 12px;flex-wrap:wrap;margin-bottom:0}
.ucsteps .who{font-size:12px;font-weight:500;color:var(--text-2)}
.ucsteps .act{margin-top:4px;font-size:14px}
.ucsteps .sys{margin-top:4px;font-size:13px;color:var(--text-3)}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ex{padding:16px;border-radius:12px;background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line)}
.ex .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex b{font-weight:500;font-size:14px}.ex b .mono{margin-right:8px}
.ex p{margin-top:6px;font-size:13px;color:var(--text-2)}
.sts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.us{padding:16px;border-radius:12px;background:var(--track);box-shadow:inset 0 0 0 1px var(--tile-line)}
.us .hd{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text-3)}
.us .say{margin-top:8px;font-size:14px}
.us .say em{font-style:normal;color:var(--text-2)}
.us ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.us li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;color:var(--text-2)}
.us li svg{width:14px;height:14px;margin-top:3px}
.us li.y svg{color:var(--ok)}.us li.n svg{color:var(--bad)}
.sd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.clog{list-style:none;display:flex;flex-direction:column}
.clog li{display:grid;grid-template-columns:48px 92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--tile-line);font-size:14px}
.clog li:first-child{border-top:0}
.clog .v,.clog .d{font-family:var(--mono);font-size:12px;color:var(--text-3);padding-top:1px}
.notyet{padding:28px 24px}
.notyet b{display:block;font-size:18px;font-weight:500}
.notyet p{margin-top:6px;color:var(--text-2);max-width:560px}
.notyet .btn{margin-top:16px}
.ucpager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ucpager a{display:flex;flex-direction:column;gap:2px;padding:16px 20px;border-radius:16px;background:var(--tile);box-shadow:var(--tile-shadow),inset 0 0 0 1px var(--tile-line);font-size:14px;transition:background .15s var(--ease)}
.ucpager a:hover{background:var(--tile-hover)}
.ucpager a small{font-size:12px;color:var(--text-3)}
.ucpager a.next{text-align:right}

/* Tài liệu liên quan */
.rfilter{display:flex;align-items:center;gap:10px;height:44px;max-width:420px;padding:0 16px;border-radius:22px;background:var(--track);box-shadow:var(--track-shadow);margin-top:14px}
.rfilter svg{width:16px;height:16px;color:var(--text-3)}
.rgroup{padding:16px 24px 12px}
.rgroup h2{display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:500;margin-bottom:6px}
.rgroup h2 .c{font-size:12px;color:var(--text-3);font-weight:400}

/* Phóng to sơ đồ */
.zoom{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:rgba(8,9,11,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-theme="light"] .zoom{background:rgba(236,234,230,.95)}
.zoom .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--win-line)}
.zoom .ttl{font-size:14px;font-weight:500;margin-right:auto}
.zoom .lvl{font-family:var(--mono);font-size:12px;color:var(--text-2);min-width:44px;text-align:center}
.zoom .stage{flex:1;overflow:auto;padding:28px;cursor:grab}
.zoom .stage img{display:block;margin:0 auto;max-width:none}

@media (max-width:1180px){
  .hoso{grid-template-columns:1fr}
  .dtree{position:static;max-height:none}
  .dt-toggle{display:flex}
  .dtree .dt-body{display:none}
  .dtree.open .dt-body{display:block}
  .otiles{grid-template-columns:1fr 1fr}
  .uclayout{grid-template-columns:1fr}
  .sum{position:static;max-height:none}
}
@media (max-width:900px){.ogrid,.olines,.twocol,.sd{grid-template-columns:1fr}}
@media (max-width:760px){
  .ohead{padding:20px 16px}.ohead h1{font-size:24px;line-height:30px}
  .sec,.part,.rgroup{padding:16px}
  .declist div{grid-template-columns:1fr}.gloss{grid-template-columns:1fr;gap:2px}.gloss dd{margin-bottom:10px}
  .clog li{grid-template-columns:40px 1fr}.clog li span:last-child{grid-column:1/-1}
  .mitem,.ritem{grid-template-columns:32px minmax(0,1fr) 16px}.mitem .rd,.ritem .rd{display:none}
  .ucpager{grid-template-columns:1fr}
  .sechead .note{margin-left:0;width:100%}
}



/* Bản đồ nghiệp vụ tỏa tròn và sơ đồ use case (bố cục theo Hồ sơ BA, màu theo Bàn dự án) */
.board{padding:12px 0 4px}
.mm{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 176px minmax(0,1fr);gap:0 34px}
.mm svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm .mcol{display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;z-index:1}
.mm .mid{display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.hub{width:172px;height:172px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 0 0 10px var(--accent-soft)}
.hub b{font-size:27px;line-height:1.05;font-weight:500;letter-spacing:-.025em}
.hub span{font-size:14px;line-height:1.3;margin-top:6px}
.hub small{font-size:12px;margin-top:10px;opacity:.8}
.mm .grp{border:1px solid color-mix(in srgb,var(--gc) 42%,transparent);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--gc) 7%,var(--tile))}
.mm .grp .gh{display:flex;align-items:center;gap:9px;font-weight:500;font-size:15px;margin:0 2px 12px;white-space:nowrap}
.mm .grp .gh i{width:10px;height:10px;border-radius:3px;background:var(--gc)}
.mm .grp .gh em{margin-left:auto;font-style:normal;font-size:12px;font-weight:400;color:var(--text-2)}
.mm .grp .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mm .ucc{display:flex;flex-direction:column;gap:0;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-line);border-radius:12px;padding:12px 16px;transition:background .15s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.mm .ucc:hover{background:var(--tile-hover);transform:translateY(-1px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gc) 70%,transparent)}
.mm .ucc .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mm .ucc .code{font-family:var(--mono);font-size:12px;color:var(--text-3);padding:0;box-shadow:none}
.mm .ucc .nm{font-weight:500;font-size:15px;line-height:1.35;margin:6px 0 3px}
.mm .ucc .who{font-size:12px;color:var(--text-2);line-height:1.5}
.mm .ucc.hot{box-shadow:inset 0 0 0 1.5px var(--warn)}
.mm .ucc.hot .code{color:var(--warn)}
.swipe{display:none}
.ucd{padding:12px 0 4px}
.ucd svg{width:100%;height:auto;display:block;max-width:1240px;margin:0 auto}
.ucd text{font-family:var(--font)}
.ucd .u-sys{fill:var(--accent-soft);fill-opacity:.5;stroke:var(--win-line);stroke-width:1.2}
.ucd .u-syst{fill:var(--text-3)}
.ucd .u-ln{stroke-opacity:.6}
.ucd .u-fn{fill:var(--wall);stroke:var(--accent)}
.ucd .u-fn.sh{fill:color-mix(in srgb,var(--warn) 14%,var(--wall));stroke:var(--warn)}
.ucd .u-fnt{fill:var(--text)}
:root[data-theme="light"] .ucd .u-fn{fill:#FFFFFF}
.ucd .u-act{fill:var(--rc)}
:root[data-theme="light"] .ucd .u-act{fill:color-mix(in srgb,var(--rc) 70%,#000)}
.gl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.gl i{width:9px;height:9px;border-radius:3px;background:var(--gc)}
@media (max-width:1000px){.mm{grid-template-columns:1fr 1fr;gap:16px}.mm svg.lines{display:none}.mm .mid{grid-column:1/-1;order:-1;margin-bottom:18px}.ucd{overflow-x:auto}.ucd svg{min-width:760px}.swipe{display:block;font-size:13px;color:var(--text-3);margin:0 0 8px}}
@media (max-width:640px){.mm{grid-template-columns:1fr}}
@media (max-width:1180px){.gwrap{align-items:flex-start}}
/* Màn thấp (1280x760…): Tổng quan vẫn vừa một màn, không cắt chữ */
@media (min-width:1181px) and (max-height:820px){
  .hero{margin-bottom:12px}.ring,.ring svg{width:80px;height:80px}.hero h1{font-size:30px;line-height:34px}
  .big .v{font-size:40px;line-height:40px}.big .k{margin-bottom:4px}.big .n{margin-top:4px}
  .proj{gap:8px;padding:12px 16px}.projects{gap:8px}
  .focus{min-height:0;padding:16px 20px;gap:12px}.focus .f-t{font-size:20px;line-height:26px}
  .dec-row{padding:8px 12px}.t-head{padding:12px 20px 8px}
  .day{min-height:0;padding:8px 12px}.task{padding:4px 8px}.week{gap:8px}.task p{-webkit-line-clamp:1}
}
@media (max-width:380px){.rail{gap:2px;padding:6px}.r-btn{width:42px;padding:0 11px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

<script>
const GATES=['Đề bài','Khảo sát','Giải pháp','Thử nghiệm','Triển khai'];
const P=BDA.projects;
const $=s=>document.querySelector(s);
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NA='<span class="na">Chưa có</span>';
const now=new Date();
const ymd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const dm=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const fd=s=>s?dm(ymd(s)):'';
const fdy=s=>s?`${fd(s)}/${ymd(s).getFullYear()}`:'';
const daysSince=s=>Math.max(0,Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-ymd(s))/864e5));
const relDay=s=>{const n=daysSince(s);return n===0?'hôm nay':n===1?'hôm qua':n+' ngày trước'};
const STATUS_DOT={'Đang làm':'run','Đang thử':'ok','Chờ quyết định':'warn','Bị chặn':'bad','Xong':'ok','Chưa bắt đầu':''};
const statusHtml=p=>`<span class="status"><span class="dot ${STATUS_DOT[p.status]||''}"></span>${esc(p.status)}</span>`;
const waitAll=()=>P.flatMap(p=>(p.waiting||[]).map(w=>({...w,p}))).sort((a,b)=>a.since.localeCompare(b.since));
const docCount=p=>(p.docs||[]).reduce((s,g)=>s+(g.items||[]).length,0);
const ucQs=p=>Object.values(BDA.ucs[p.id]||{}).reduce((s,u)=>s+(u.questions||[]).length,0);
const gateNow=p=>p.gates&&p.gates.now!=null?p.gates.now:null;

/* ===== Dữ liệu mẫu: việc tuần (chưa có nguồn thật; thay khi có nhật ký việc) ===== */
const TASKS=[
 {t:'Gửi tin mời thử SMS cho telesale',p:'sms',d:0,done:true},
 {t:'Trình sếp hướng tự dựng phần mềm kho',p:'kho-7',d:0,done:false,focus:true},
 {t:'Soạn 3 cách lấy số liệu quảng cáo',p:'fb-ads',d:1,done:false},
 {t:'Thử đọc số cân FI05 qua cáp USB',p:'kho-7',d:2,done:false},
 {t:'Hỏi IT chỗ đặt máy chủ',p:'bao-cao',d:3,done:false},
];
const PAST=[
 {t:'Chạy thử phân quyền trên Nextwaves',p:'kho-7',w:-1,d:2,done:true},
 {t:'Gửi SMS thử ở Philippines',p:'sms',w:-1,d:3,done:true},
 {t:'Chốt luồng cân và QR',p:'kho-7',w:-1,d:1,done:true},
 {t:'Đọc tài liệu SmsMk365',p:'sms',w:-1,d:4,done:false},
];
const OLDEST=-1;let off=0;
const DAYS=['T2','T3','T4','T5','T6'];
const wd=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-wd);
const dayOf=(w,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+w*7+i);return d};
const short=id=>(P.find(p=>p.id===id)||{}).code||id;

/* ===== Phần đầu trang chung ===== */
function topBar(crumb){
  const dn=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  return `<header class="top rise" style="--d:0">
    <nav class="crumb" aria-label="Đường dẫn">${crumb||`<span class="cur">Bàn dự án</span><span>/</span><span>${dn[now.getDay()]}, ${dm(now)}/${now.getFullYear()}</span>`}</nav>
    <div class="top-right">
      <button class="search" data-say="Tìm kiếm có ở bản sau"><svg class="i"><use href="#i-search"/></svg>Tìm dự án, tài liệu<kbd>⌘K</kbd></button>
      <button class="circle" data-say="Thêm dự án: nhờ Claude tạo file trong data/" aria-label="Dự án mới"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="circle avatar" data-say="Hải Nam · PO/BA" aria-label="Tài khoản">HN</button>
    </div></header>`;
}

/* ===== Thẻ dự án (Tổng quan và trang Dự án) ===== */
function card(p){
  const g=gateNow(p);const it=(p.gates&&p.gates.items)||[];
  const pct=g!=null&&it[g]&&it[g].pct!=null?it[g].pct:null;
  const w=(p.waiting||[]).length;
  return `<a class="proj" href="#/du-an/${esc(p.id)}" aria-label="${esc(p.name)}: mở trang dự án">
    <div class="p-top"><span class="code">${esc(p.code)}</span>${statusHtml(p)}</div>
    <div><div class="p-name">${esc(p.short||p.name)}</div><div class="p-goal" title="${esc(p.goal)}">${esc(p.summary||p.goal)}</div></div>
    <div class="p-foot">
      ${g!=null?`<div class="gate-bar" aria-hidden="true">${GATES.map((_,i)=>`<div class="seg ${i<g?'done':i===g?'now':''}">${i===g&&pct!=null?`<i style="--p:${pct}%"></i>`:''}</div>`).join('')}</div>
      <div class="p-meta"><span>Cổng <b>${GATES[g]}</b></span><span class="num">${g+1}/5</span></div>`:''}
      ${p.due?`<div class="p-meta"><span>Hạn</span><span class="num">${fd(p.due)}</span></div>`:''}
      ${w?`<div class="p-meta"><span>Chờ quyết định</span><span class="num">${w}</span></div>`:''}
    </div></a>`;
}

/* ===== Tổng quan ===== */
let filter='all',decAll=false;const DEC_N=3;
function viewHome(){
  document.title='Bàn dự án';
  const W=waitAll();
  const qs=P.reduce((s,p)=>s+(p.openQuestions||[]).length+ucQs(p),0);
  const docs=P.reduce((s,p)=>s+docCount(p),0);
  const done=TASKS.filter(t=>t.done).length;const C=2*Math.PI*44;const pct=Math.round(done/TASKS.length*100);
  $('#view').innerHTML=`${topBar()}
  <section class="hero">
    <div class="hero-main rise" style="--d:1">
      <div class="ring" title="Việc tuần này (dữ liệu mẫu)"><svg viewBox="0 0 104 104" aria-hidden="true"><circle class="bg" cx="52" cy="52" r="44"/><circle class="fg" id="ring-fg" cx="52" cy="52" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="ring-text"><div><b>${done}/${TASKS.length}</b><small>việc mẫu</small></div></div></div>
      <h1>${P.length} dự án<br><span>đang chạy</span></h1>
    </div>
    <div class="big rise" style="--d:2"><div class="k">Chờ quyết định</div><div class="v">${W.length}</div><div class="n"><span class="dot warn"></span>${W.length?`Lâu nhất ${daysSince(W[0].since)} ngày`:'Không có'}</div></div>
    <div class="big rise" style="--d:3"><div class="k">Câu hỏi mở</div><div class="v">${qs}</div><div class="n">${P.filter(p=>(p.openQuestions||[]).length).length} dự án có câu hỏi</div></div>
    <div class="big rise" style="--d:4"><div class="k">Tài liệu liên quan</div><div class="v">${docs}</div><div class="n">${P.filter(p=>!docCount(p)).length} dự án chưa có</div></div>
  </section>
  <div class="grid">
    <section class="tile rise" style="--d:5">
      <div class="t-head"><h2>Dự án</h2>
        <div class="track" id="filter">
          <button class="pill" data-f="all" aria-pressed="${filter==='all'}">Tất cả</button>
          <button class="pill" data-f="run" aria-pressed="${filter==='run'}">Đang chạy</button>
          <button class="pill" data-f="attn" aria-pressed="${filter==='attn'}">Chờ quyết định</button>
        </div></div>
      <div class="projects" id="projects"></div>
    </section>
    <div class="col">
      <section class="focus rise" style="--d:6" id="focus"></section>
      <section class="tile rise" style="--d:7">
        <div class="t-head"><h2>Chờ quyết định</h2>${W.length>DEC_N?`<button type="button" class="more" id="dec-more" aria-expanded="${decAll}">${decAll?'Thu gọn':`Xem cả ${W.length}`}</button>`:`<span class="meta">${W.length} việc</span>`}</div>
        <div class="dec">${W.length?(decAll?W:W.slice(0,DEC_N)).map(w=>`<a class="dec-row" href="#/du-an/${esc(w.p.id)}" title="${esc(w.text)}"><p>${esc(w.summary||w.text)}</p><small><span class="num">${esc(w.p.code)}</span><span class="who">${esc(w.who)}</span><span class="wait">${daysSince(w.since)} ngày</span></small></a>`).join(''):'<p class="empty dec-empty">Không có việc nào chờ</p>'}</div>
      </section>
    </div>
    <section class="tile wk rise" style="--d:8">
      <div class="t-head"><div class="wk-nav"><h2 id="wk-title">Tuần này</h2><span class="mini-tag">Dữ liệu mẫu</span><button class="circle" id="wk-prev" aria-label="Tuần trước"><svg><use href="#i-arrow"/></svg></button><button class="circle" id="wk-next" aria-label="Tuần sau"><svg><use href="#i-arrow"/></svg></button></div><div style="display:flex;align-items:center;gap:12px"><span class="meta num" id="wk-count"></span><div class="wk-bar"><i id="wk-bar"></i></div></div></div>
      <div class="week" id="week"></div>
    </section>
  </div>`;
  renderProjects();renderFocus();renderWeek();
  requestAnimationFrame(()=>setTimeout(()=>{const r=$('#ring-fg');if(r)r.style.strokeDashoffset=C*(1-pct/100)},300));
}
function renderProjects(){
  const list=P.filter(p=>filter==='all'||(filter==='run'?['Đang làm','Đang thử'].includes(p.status):(p.waiting||[]).length));
  $('#projects').innerHTML=list.map(card).join('')||`<p class="empty" style="padding:12px">Không có dự án nào ở nhóm này</p>`;
}
function renderFocus(){
  const t=TASKS.find(x=>x.focus);const p=P.find(x=>x.id===t.p)||{};
  $('#focus').innerHTML=`
   <div class="f-k"><span>Việc quan trọng nhất</span><span class="mini-tag">Dữ liệu mẫu</span></div>
   <div><div class="f-t">${esc(t.t)}</div><div class="f-m" style="margin-top:6px">${esc(p.short||'')} · ${esc(p.code||'')}</div></div>
   <div class="f-row"><div class="f-m">Hạn: chưa có</div>
     <div class="toggle2"><button id="f-no" class="${t.done?'':'yes'}" aria-label="Chưa xong">${ico('x')}</button><button id="f-yes" class="${t.done?'yes':''}" aria-label="Xong">${ico('check')}</button></div></div>`;
}
function renderWeek(){
  const cur=off===0;const list=cur?TASKS.map((t,k)=>({...t,k})):PAST.map((t,k)=>({...t,k:'p'+k})).filter(t=>t.w===off);
  const done=list.filter(t=>t.done).length;
  $('#wk-title').textContent=cur?'Tuần này':'Tuần trước';
  $('#wk-prev').disabled=off<=OLDEST;$('#wk-next').disabled=cur;
  $('#wk-count').textContent=`${done}/${list.length} xong`;$('#wk-bar').style.width=(list.length?done/list.length*100:0)+'%';
  $('#week').classList.toggle('past',!cur);
  $('#week').innerHTML=DAYS.map((d,i)=>{const items=list.filter(t=>t.d===i);const today=cur&&i===wd;return `
   <div class="day ${today?'today':''}"><div class="day-h"><span>${d}${today?' · hôm nay':''}</span><b>${String(dayOf(off,i).getDate()).padStart(2,'0')}</b></div>
   ${items.map(t=>`<button class="task ${t.done?'done':!cur?'miss':''}" data-k="${t.k}" title="${esc(t.t)}"><span class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><p>${esc(t.t)}</p><small>${esc(short(t.p))}</small></span></button>`).join('')||'<span class="empty">Trống</span>'}</div>`}).join('');
}

function viewList(){
  document.title='Dự án – Bàn dự án';
  $('#view').innerHTML=`${topBar(`<a href="#/">Bàn dự án</a><span>/</span><span class="cur">Dự án</span>`)}
  <div class="page-h rise" style="--d:1"><div><h1>Dự án</h1><p>${P.length} dự án. Bấm một dự án để xem chi tiết.</p></div></div>
  <div class="plist rise" style="--d:2">${P.map(card).join('')}</div>`;
}

/* ===== Hồ sơ dự án: dữ liệu dùng chung ===== */
const UCS=p=>BDA.ucs[p.id]||{};
const ucIds=p=>(p.groups||[]).flatMap(g=>g.ucs||[]);
const LV=s=>/chốt/i.test(s||'')?'chot':/duyệt/i.test(s||'')?'duyet':/đang viết/i.test(s||'')?'viet':'chua';
const LVN={chot:'đã chốt',duyet:'đang duyệt',viet:'đang viết',chua:'chưa viết'};
const ucPill=s=>`<span class="ust l-${LV(s)}"><i></i>${esc(s||'Chưa viết')}</span>`;
const TAGS={chot:'Đã chốt','de-xuat':'Đề xuất','can-chot':'Cần chốt','chua-co':'Phần mềm chưa có'};
const tagH=t=>t&&TAGS[t]?`<span class="tg t-${t}"><i></i>${TAGS[t]}</span>`:'';
const hasDetail=u=>!!(u&&(u.steps||[]).length);
const href=(p,...a)=>'#/du-an/'+[p.id,...a].filter(Boolean).map(encodeURIComponent).join('/');
const allDocs=p=>(p.docs||[]).flatMap(g=>(g.items||[]).map(it=>({...it,group:g.group})));
function docKind(it){
  if(it.type==='pdf')return['PDF','file'];
  const u=it.url||'';
  if(!u)return['Chưa có link','file'];
  if(/docs\.google\.com\/spreadsheets/.test(u))return['Google Sheets','grid'];
  if(/docs\.google\.com\/presentation/.test(u))return['Google Slides','spec'];
  if(/drive\.google\.com\/drive\/folders/.test(u))return['Thư mục Drive','folder'];
  if(/docs\.google\.com\/document/.test(u))return['Google Docs','note'];
  if(/drive\.google\.com/.test(u))return['Google Drive','folder'];
  if(/claude\.ai\//.test(u))return['Trang Claude','spark'];
  return['Trang web','link'];
}
const qOf=it=>esc(((it.name||'')+' '+(it.note||'')+' '+docKind(it)[0]+' '+(it.group||'')).toLowerCase());
function docRow(it,cls){
  const [k,ic]=docKind(it);
  const inner=`<span class="kd">${ico(ic)}</span><span class="rb"><b>${esc(it.name)}</b><span class="rm"><span>${k}</span>${it.note?`<span>${esc(it.note)}</span>`:''}</span></span><span class="rd num">${it.date?fd(it.date):''}</span>`;
  return it.url
    ?`<a class="${cls}" data-q="${qOf(it)}" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.name)} (${k}, mở tab mới)">${inner}<span class="ro">${ico('ext')}</span></a>`
    :`<div class="${cls} nolink" data-q="${qOf(it)}" title="Chưa có link">${inner}<span class="ro"></span></div>`;
}

/* Các mục của tài liệu đặc tả */
function specSections(p){
  const u=UCS(p),groups=p.groups||[],links=p.useCaseLinks||{};
  const ids=ucIds(p);
  const decs=p.decisions||[],qs=p.openQuestions||[],gl=p.glossary||[];
  const roles=(p.roles||[]).concat(Object.keys(links).filter(r=>!(p.roles||[]).includes(r))).filter(r=>(links[r]||[]).length);
  const fns=[...new Set(roles.flatMap(r=>links[r]))];
  const ucQ=ids.flatMap(id=>((u[id]||{}).questions||[]).map(q=>({id,q})));
  const S=[];
  if(p.goal&&((p.scopeIn||[]).length||(p.roles||[]).length||groups.length))S.push({id:'tong-quan',title:'Tổng quan và phạm vi',html:`
    <p class="lead">${esc(p.goal)}</p>

      ${(p.scopeIn||[]).length?`<div><h3 class="lbl">Trong phạm vi</h3><ul class="plain">${p.scopeIn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${(p.scopeOut||[]).length?`<div><h3 class="lbl">Ngoài phạm vi</h3><ul class="plain out">${p.scopeOut.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>`:''}
    ${(p.roles||[]).length?`<h3 class="lbl" style="margin-top:20px">Vai trò</h3><div class="chips">${p.roles.map(r=>`<span class="chip">${esc(r)}</span>`).join('')}</div>`:''}`});
  if(groups.length)S.push({id:'ban-do',title:'Bản đồ nghiệp vụ',note:`${groups.length} luồng, ${ids.length} use case. Bấm thẻ để mở đặc tả.`,html:`<div class="board">${mindmapHtml(p)}</div>`});
  const nRoles=Object.keys(links).filter(k=>(links[k]||[]).length).length;
  if(fns.length)S.push({id:'ai-dung',title:'Ai dùng chức năng nào',note:`${nRoles} vai trò. Ô viền vàng là chức năng dùng chung.`,html:`<p class="swipe">Vuốt ngang để xem hết sơ đồ.</p><div class="board ucd">${useCaseSvg(p)}</div>`});
  if(ids.length)S.push({id:'use-case',title:'Danh sách use case',note:`${ids.length} use case`,html:`
    <div class="tblwrap"><table class="t"><thead><tr><th>Use case</th><th style="width:140px">Luồng</th><th style="width:140px">Trạng thái</th></tr></thead><tbody>
    ${groups.map(g=>(g.ucs||[]).map(id=>{const x=u[id]||{name:'(chưa có file)',status:''};return `<tr><td><a class="uclink" href="${href(p,id)}"><span class="mono">${esc(id)}</span>${esc(x.name)}</a></td><td><span class="gl" style="--gc:${esc(g.color||'#8a9894')}"><i></i>${esc(g.name)}</span></td><td>${ucPill(x.status)}</td></tr>`}).join('')).join('')}</tbody></table></div>`});
  if(decs.length)S.push({id:'quyet-dinh',title:'Quyết định',note:`${decs.length} mục, mới nhất trên cùng`,html:`
    <div class="declist">${decs.map(d=>`<div><span class="d">${fdy(d.date)}</span><span>${esc(d.text)}</span><span class="by">${esc(d.by||'')}</span></div>`).join('')}</div>`});
  if(qs.length||ucQ.length)S.push({id:'cau-hoi',title:'Câu hỏi mở',note:`${qs.length+ucQ.length} câu`,html:`
    ${qs.length?`<ol class="qlist">${qs.map(q=>`<li><span>${esc(q)}</span></li>`).join('')}</ol>`:''}
    ${ucQ.length?`<h3 class="lbl" style="margin-top:16px">Trong use case</h3><ol class="qlist">${ucQ.map(x=>`<li><span>${esc(x.q)} <a href="${href(p,x.id)}">${esc(x.id)}</a></span></li>`).join('')}</ol>`:''}`});
  if(gl.length)S.push({id:'thuat-ngu',title:'Thuật ngữ',note:`${gl.length} từ`,html:`
    <dl class="gloss">${gl.map(g=>`<dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd>`).join('')}</dl>`});
  return S;
}

/* Cây bên trái: Tài liệu đặc tả + Tài liệu liên quan */

      ${secs.length?`<div class="dt-items">${secs.map(s=>`<a class="dt-i ${view==='spec'&&sec===s.id?'on':''}" data-q="${esc(s.title.toLowerCase())}" href="${href(p,'dac-ta',s.id)}"><span class="nm">${esc(s.title)}</span></a>`).join('')}</div>`:'<p class="dt-empty">Chưa có đặc tả</p>'}</div>
    <div class="dt-g"><a class="dt-h ${view==='rel'?'on':''}" href="${href(p,'lien-quan')}">${ico('folder')}<span>Tài liệu liên quan</span>${n?`<span class="c num">${n}</span>`:''}</a>
      ${groups.length?groups.map((g,i)=>`<details class="dt-f"><summary><svg class="i"><use href="#i-chev"/></svg><span>${esc(g.group)}</span><span class="c num">${g.items.length}</span></summary><div class="dt-items">${g.items.map(it=>di({...it,group:g.group})).join('')}</div></details>`).join(''):'<p class="dt-empty">Chưa có tài liệu</p>'}</div>

function shell(p,view,sec,tail,inner){
  const crumb=`<a href="#/">Bàn dự án</a><span>/</span><a href="#/du-an">Dự án</a><span>/</span>${tail?`<a href="${href(p)}">${esc(p.short||p.name)}</a><span>/</span><span class="cur">${tail}</span>`:`<span class="cur">${esc(p.short||p.name)}</span>`}`;
  $('#view').innerHTML=`${topBar(crumb)}<div class="hoso">${tree(p,view,specSections(p),sec)}<div class="hmain">${inner}</div></div>`;
}
function filterTree(inp){
  const nav=inp.closest('.dtree');const q=inp.value.trim().toLowerCase();let hit=0;
  nav.querySelectorAll('.dt-i').forEach(a=>{const ok=!q||(a.dataset.q||'').includes(q);a.hidden=!ok;if(ok)hit++});
  nav.querySelectorAll('.dt-f').forEach(d=>{const any=[...d.querySelectorAll('.dt-i')].some(a=>!a.hidden);d.hidden=!any;if(q&&any)d.open=true});
  nav.querySelector('.dt-none').hidden=!q||hit>0;
}

/* ===== Bản đồ nghiệp vụ (sơ đồ tỏa tròn) và sơ đồ use case – chuyển từ Hồ sơ BA (Trang web/app.js), đổi sang giao diện kính ===== */
const ROLE_COLORS=['#7fa8f0','#e8925a','#a98be0','#e07a86','#b5bd4f','#4fb8d0','#d4a94a'];
function roleColor(p,r){const i=(p.roles||[]).indexOf(r);return ROLE_COLORS[(i<0?(p.roles||[]).length+r.length:i)%ROLE_COLORS.length]}
const whoDots=s=>String(s||'').split('·').map(x=>esc(x.trim())).filter(Boolean).join(', ');
function mindmapHtml(p){
  const groups=p.groups||[],u=UCS(p);
  const total=groups.reduce((s,g)=>s+(g.ucs||[]).length,0);
  // chia nhóm hai bên, cân số UC, giữ thứ tự
  let acc=0,split=groups.length;
  for(let i=0;i<groups.length;i++){if(acc+(groups[i].ucs||[]).length/2>total/2){split=i;break}acc+=(groups[i].ucs||[]).length}
  if(split===0)split=1;
  const left=groups.slice(0,split),right=groups.slice(split);
  const grp=(g,side)=>`<div class="grp" data-side="${side}" data-color="${esc(g.color||'#8a9894')}" style="--gc:${esc(g.color||'#8a9894')}">
    <div class="gh"><i></i>${esc(g.name)}<em>${(g.ucs||[]).length} UC</em></div>
    <div class="cards">${(g.ucs||[]).map(id=>{const x=u[id]||{name:'(chưa có file '+id+')',status:''};
      return `<a class="ucc ${LV(x.status)==='duyet'?'hot':''}" href="${href(p,id)}">
        <div class="r1"><span class="code">${esc(id)}</span>${ucPill(x.status)}</div>
        <div class="nm">${esc(x.name)}</div>${x.who?`<div class="who">${whoDots(x.who)}</div>`:''}</a>`}).join('')}</div></div>`;
  const parts=p.name.split(/:\s*/);
  let sub=(parts[1]||'').replace(/^kiểm soát kho\s+/i,'');sub=sub.charAt(0).toUpperCase()+sub.slice(1);
  return `<div class="mm">
    <svg class="lines" aria-hidden="true"></svg>
    <div class="mcol">${left.map(g=>grp(g,'L')).join('')}</div>
    <div class="mid"><div class="hub"><b>${esc(parts[0])}</b>${sub?`<span>${esc(sub)}</span>`:''}<small>${groups.length} luồng, ${total} UC</small></div></div>
    <div class="mcol">${right.map(g=>grp(g,'R')).join('')}</div>
  </div>`;
}
function drawMindmap(mm){
  if(!mm||!mm.isConnected)return;
  const svg=mm.querySelector('svg.lines'),hub=mm.querySelector('.hub');
  if(getComputedStyle(svg).display==='none')return;
  const base=mm.getBoundingClientRect(),hb=hub.getBoundingClientRect();
  const cx=hb.left-base.left+hb.width/2,cy=hb.top-base.top+hb.height/2,r=hb.width/2;
  let out='';
  mm.querySelectorAll('.grp').forEach(g=>{
    const b=g.getBoundingClientRect(),L=g.dataset.side==='L',col=g.dataset.color;
    const ex=(L?b.right:b.left)-base.left,ey=b.top-base.top+Math.min(28,b.height/2);
    const ang=Math.atan2(ey-cy,ex-cx);
    const sx=cx+Math.cos(ang)*(r+6),sy=cy+Math.sin(ang)*(r+6);
    const dx=(ex-sx)*0.55;
    out+=`<path d="M${sx.toFixed(1)},${sy.toFixed(1)} C${(sx+dx).toFixed(1)},${sy.toFixed(1)} ${(ex-dx).toFixed(1)},${ey.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.8" opacity=".8"/>`
      +`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="3" fill="${col}"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="${col}"/>`;
  });
  svg.innerHTML=out;
}
/* Sơ đồ use case: vai trò → chức năng (useCaseLinks), chức năng dùng chung ở giữa, viền vàng */
function useCaseSvg(p){
  const links=p.useCaseLinks||{};
  const actors=(p.roles||[]).concat(Object.keys(links).filter(a=>!(p.roles||[]).includes(a))).filter(a=>(links[a]||[]).length);
  const fnActors={};
  actors.forEach(a=>links[a].forEach(f=>{(fnActors[f]=fnActors[f]||[]).push(a)}));
  const side={};let nL=0,nR=0;
  [...actors].sort((a,b)=>links[b].length-links[a].length).forEach(a=>{if(nL<=nR){side[a]='L';nL+=links[a].length}else{side[a]='R';nR+=links[a].length}});
  const fnSide=f=>{const s=new Set(fnActors[f].map(a=>side[a]));return s.size>1?'M':[...s][0]};
  const shared=Object.keys(fnActors).filter(f=>fnSide(f)==='M');
  const order=s=>actors.filter(a=>side[a]===s).sort((a,b)=>{
    const sa=links[a].some(f=>shared.includes(f))?0:1,sb=links[b].some(f=>shared.includes(f))?0:1;
    return sa-sb||actors.indexOf(a)-actors.indexOf(b)});
  const W=1200,ROW=62,top=84,FS=14;
  const ctx=document.createElement('canvas').getContext('2d');ctx.font=`500 ${FS}px Inter, sans-serif`;
  const wrap=t=>{if(t.length<=26)return[t];const w=t.split(' ');let a='',lines=[];
    w.forEach(x=>{if((a+' '+x).trim().length>Math.ceil(t.length/2)+3&&a){lines.push(a);a=x}else a=(a+' '+x).trim()});lines.push(a);return lines};
  const pos={};
  const place=(f,x,y)=>{const lines=wrap(f);const tw=Math.max(...lines.map(l=>ctx.measureText(l).width));
    pos[f]={x,y,rx:Math.max(96,tw/2+30),ry:lines.length>1?29:23,lines}};
  const colX={L:410,M:W/2,R:W-410};
  shared.forEach((f,i)=>place(f,colX.M,top+34+i*ROW));
  const actorY={};let maxRow=shared.length;
  ['L','R'].forEach(s=>{
    let row=shared.length;
    order(s).forEach(a=>{
      const own=links[a].filter(f=>fnSide(f)===s&&!pos[f]);const ys=[];
      own.forEach(f=>{place(f,colX[s],top+34+row*ROW);ys.push(pos[f].y);row++});
      const sh=links[a].filter(f=>shared.includes(f)).map(f=>pos[f].y);
      actorY[a]=sh.length?sh.reduce((x,y)=>x+y,0)/sh.length:ys.length?(ys[0]+ys[ys.length-1])/2:top+34+row*ROW;
    });
    let last=-1e9;order(s).forEach(a=>{if(actorY[a]<last+120)actorY[a]=last+120;last=actorY[a]});
    maxRow=Math.max(maxRow,row);
  });
  const actorMaxY=Math.max(...Object.values(actorY));
  const bTop=14,bBot=Math.max(top+34+(maxRow-1)*ROW+46,actorMaxY+24),H=bBot+64;
  const bx1=190,bx2=W-190,ax={L:84,R:W-84};
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ use case: vai trò và chức năng">`;
  s+=`<rect class="u-sys" x="${bx1}" y="${bTop}" width="${bx2-bx1}" height="${bBot-bTop}" rx="24"/>`;
  s+=`<text class="u-syst" x="${W/2}" y="${bTop+34}" text-anchor="middle" font-size="14" font-weight="500">${esc(p.useCaseSystem||'Phần mềm')}</text>`;
  actors.forEach(a=>links[a].forEach(f=>{
    const e=pos[f],L=side[a]==='L';
    const x1=ax[side[a]]+(L?24:-24),y1=actorY[a]-8;
    const x2=e.x+(L?-e.rx:e.rx);
    s+=`<line class="u-ln" x1="${x1}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${e.y}" stroke="${roleColor(p,a)}" stroke-width="1.2"/>`;
  }));
  Object.keys(pos).forEach(f=>{const e=pos[f],sh=fnSide(f)==='M';
    s+=`<ellipse class="u-fn ${sh?'sh':''}" cx="${e.x}" cy="${e.y}" rx="${e.rx.toFixed(1)}" ry="${e.ry}" stroke-width="1.4"/>`;
    e.lines.forEach((l,i)=>{s+=`<text class="u-fnt" x="${e.x}" y="${(e.y+5+(i-(e.lines.length-1)/2)*17).toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="500">${esc(l)}</text>`});

/* Lớp phóng to sơ đồ */
function zoom(kind){
  const img0=document.querySelector(`.fig[data-kind="${kind}"] img`);if(!img0)return;
  const opener=document.activeElement;
  const ov=document.createElement('div');ov.className='zoom';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Sơ đồ phóng to');
  ov.innerHTML=`<div class="bar"><span class="ttl">${esc(img0.alt)}</span><button class="btn" data-a="out" aria-label="Thu nhỏ">−</button><span class="lvl">100%</span><button class="btn" data-a="in" aria-label="Phóng to">+</button><button class="btn" data-a="fit">Vừa màn hình</button><button class="btn" data-a="one">100%</button><button class="btn" data-a="close">${ico('x')}Đóng</button></div><div class="stage" tabindex="0"><img alt="${esc(img0.alt)}" data-base="${img0.dataset.base}" src="${figSrc(img0.dataset.base)}"></div>`;
  document.body.appendChild(ov);
  const img=ov.querySelector('img'),st=ov.querySelector('.stage'),lvl=ov.querySelector('.lvl');let z=1,nw=0,nh=0;
  const apply=v=>{z=Math.min(4,Math.max(.2,v));img.style.width=nw*z+'px';lvl.textContent=Math.round(z*100)+'%'};
  const fit=()=>{const r=st.getBoundingClientRect();apply(Math.min((r.width-56)/nw,1.6))};
  img.onload=()=>{nw=img.naturalWidth||1000;nh=img.naturalHeight||1000;fit()};if(img.complete&&img.naturalWidth)img.onload();
  const close=()=>{ov.remove();removeEventListener('keydown',key);removeEventListener('hashchange',close);if(opener&&opener.focus)opener.focus()};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='+'||e.key==='=')apply(z*1.25);else if(e.key==='-')apply(z/1.25);else if(e.key==='Tab'){const f=[...ov.querySelectorAll('button,.stage')];const i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}};
  addEventListener('keydown',key);addEventListener('hashchange',close);
  ov.querySelector('.bar').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;({in:()=>apply(z*1.25),out:()=>apply(z/1.25),fit,one:()=>apply(1),close})[a.dataset.a]()});
  let drag=null;
  st.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,l:st.scrollLeft,t:st.scrollTop}});
  st.addEventListener('pointermove',e=>{if(!drag)return;st.scrollLeft=drag.l-(e.clientX-drag.x);st.scrollTop=drag.t-(e.clientY-drag.y)});
  st.addEventListener('pointerup',()=>drag=null);st.addEventListener('pointerleave',()=>drag=null);
  setTimeout(()=>ov.querySelector('[data-a="close"]').focus(),0);
}

  if(el.classList.contains('task')){const k=el.dataset.k;const t=k[0]==='p'?PAST[+k.slice(1)]:TASKS[k];t.done=!t.done;viewHome();return say(t.done?'Đã xong một việc (mẫu)':'Mở lại một việc (mẫu)')}
  if(el.id==='f-yes'||el.id==='f-no'){const t=TASKS.find(x=>x.focus);t.done=el.id==='f-yes';viewHome();return say(t.done?'Việc quan trọng nhất: xong':'Việc quan trọng nhất: chưa xong')}
  if(el.id==='dec-more'){decAll=!decAll;viewHome();const b=$('#dec-more');if(b)b.focus();return}
  if(el.closest('#filter')){filter=el.dataset.f;document.querySelectorAll('#filter .pill').forEach(b=>b.setAttribute('aria-pressed',b===el));return renderProjects()}
  if(el.id==='r-expand'){const w=$('#rail').classList.toggle('wide');el.setAttribute('aria-label',w?'Thu gọn':'Mở rộng');return}
  if(el.id==='r-theme')return setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  if(el.classList.contains('sw')){setPalette(el.dataset.p);return say('Màu nhấn: '+el.title)}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();say('Tìm kiếm có ở bản sau')}});

setTheme(store('bda3-theme')||'dark');setPalette(store('bda3-palette')||'champagne');
route();
</script>
</body>
