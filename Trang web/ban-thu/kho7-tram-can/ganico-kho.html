<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAFAFC;--card:#FFFFFF;--rail:#FCFCFD;--ink:#1E1E20;--mute:#5F6367;--line:#E0E5EB;--line2:#EEF0F3;--input:#C6CCD5;
--primary:#0A81FF;--primary-ink:#0068D6;--accent:#E6F2FF;--gray:#EFEFF1;
--ok:#1B7F3B;--ok-bg:#E3F2E3;--warn:#965A12;--warn-bg:#F6EBD3;--bad:#B52A22;--bad-bg:#FBE6E4;
--font:'Be Vietnam Pro',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--simh:48px}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid transparent;border-radius:9px;height:32px;padding:0 12px;font-size:13px;font-weight:500;background:var(--gray);white-space:nowrap}
button:hover{filter:brightness(.97)}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.b-pri{background:var(--primary);color:#fff}
.b-out{background:var(--card);border-color:var(--input)}
.b-bad{background:var(--card);border-color:var(--bad);color:var(--bad)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}

/* shell */
.shell{display:flex;height:100vh}
.rail{width:236px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--rail);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px}
.brand .ic{width:28px;height:28px;border-radius:8px;background:linear-gradient(180deg,#3B9BFF,#0A81FF);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.brand b{font-size:15px;flex:1}
.find{display:flex;align-items:center;gap:8px;background:var(--gray);border-radius:12px;height:36px;padding:0 10px;color:var(--mute);font-size:14px;margin-bottom:8px}
.find kbd{margin-left:auto;font:11px var(--font);border:1px solid var(--input);border-radius:6px;padding:1px 5px;background:var(--card)}
.grp-t{font-size:12px;color:var(--mute);padding:4px 10px;font-weight:500}
.rl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14px}
.rl:hover{background:var(--gray)}
.rl.on{background:var(--accent);color:var(--primary-ink);font-weight:600}
.rl svg{width:18px;height:18px;flex-shrink:0}
.rl .cnt{margin-left:auto;background:var(--primary);color:#fff;font-size:11px;font-weight:600;border-radius:999px;min-width:22px;height:20px;display:grid;place-items:center;padding:0 6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:15px;font-weight:600;flex:1}
.seg{display:flex;background:var(--gray);border-radius:9px;padding:2px}
.seg button{height:26px;padding:0 10px;background:transparent;font-size:12px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.content{flex:1;overflow:auto;padding:24px 28px 80px}
.page-h{font-size:28px;font-weight:700;letter-spacing:-.01em}
.page-d{color:var(--mute);font-size:14px;max-width:760px;margin:6px 0 16px}

/* cards, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card+.card{margin-top:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.wrow+.wrow{border-top:1px solid var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#9C6411}
.dot.red{background:var(--bad)}.dot.blue{background:var(--primary)}
.wrow .tx{flex:1}
.wrow .tx b{font-weight:600}
.wrow.late .tx{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--gray);color:var(--mute);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.blue{background:var(--accent);color:var(--primary-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line2)}
.tbl .r{text-align:right}
.tbl td{white-space:nowrap}
.tbl tr.pend td{color:var(--warn)}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
.crumb a{color:var(--primary-ink);font-weight:500}
.crumb span{color:var(--mute)}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hd .ttl{font-size:22px;font-weight:700}
.hd .meta{color:var(--mute)}
.sp{flex:1}
.empty{color:var(--mute);padding:24px 0;text-align:center}

/* labels step */
.lblrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0}
.lblrow+.lblrow{border-top:1px solid var(--line2)}
.lblrow .sku{font-weight:600}
.lblrow .sub{color:var(--mute);font-size:13px}
.lab{display:grid;grid-template-columns:76px 1fr;gap:10px;border:1px dashed var(--input);border-radius:8px;padding:8px;width:300px;background:#fff}
.lab svg{width:76px;height:76px}
.lab .s{font-weight:700;font-size:15px;line-height:1.2}
.lab .l{font-size:12px;color:var(--mute)}
.lab .n{font-family:var(--mono);font-weight:700;font-size:18px}
.detgrid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}
.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld input{width:100%;height:36px;border:1px solid var(--input);border-radius:9px;padding:0 10px;font:inherit;background:var(--gray)}
.skuhd{font-weight:600;margin:4px 0 8px}
.skuhd+.detgrid{margin-bottom:12px}

/* station */
.station{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
.st-left{display:grid;gap:12px}
.st-right{display:grid;gap:14px}
.scale{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:16px 22px}
.scale .kg{font-family:var(--mono);font-weight:700;font-size:112px;line-height:1;letter-spacing:-.03em}
.scale .kg small{font-size:36px;margin-left:10px;color:var(--mute)}
.scale .side{display:grid;gap:8px;justify-items:end;align-content:start}
.scale .facts{grid-column:1/-1;display:flex;gap:36px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:12px}
.fact .k{font-size:12px;color:var(--mute);font-weight:500}
.fact .v{font-size:22px;font-weight:700}
.fact .v.off{color:var(--warn)}
.fact .v.big{font-size:28px}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;border-radius:999px;padding:5px 14px;font-size:15px}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}.chip.mute{color:var(--mute);background:var(--gray)}
.alert{border-radius:12px;padding:8px 10px 8px 16px;font-weight:600;font-size:18px;min-height:52px;display:flex;align-items:center;gap:10px}
.alert.empty{visibility:hidden}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad);font-size:22px}
.alert .msg{flex:1}
.alert button{height:38px;font-size:14px;background:#fff;border-color:currentColor;color:inherit}
.alert select{font:inherit;font-size:14px;height:38px;border:1px solid currentColor;border-radius:9px;padding:0 8px;background:#fff;color:var(--ink)}
.tabs{display:flex;gap:6px}
.tabs button{height:36px;padding:0 14px;font-size:14px;background:var(--gray);color:var(--mute);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--primary-ink)}
.bags h3{justify-content:space-between}
.baglist{list-style:none;max-height:320px;overflow:auto}
.baglist li{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:17px}
.baglist li .bn{font-family:var(--mono);font-weight:700;min-width:86px}
.baglist li .bs{color:var(--mute);flex:1;font-size:15px}
.baglist li.wrong{background:var(--bad-bg);color:var(--bad)}
.baglist li.wrong .bs{color:var(--bad);font-weight:600}
.baglist.stl{max-height:420px}
.station>.st-left,.station>.st-right,.st-right>*,.st-left>*{min-width:0}
.st-right .tbl td{white-space:normal}
.skurow .miss{grid-column:1/-1;font-size:13px;color:#a15c00;background:#fff4e0;border-radius:8px;padding:6px 8px;margin-top:4px}
.why{width:100%;min-width:180px;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
tr.pend .why{border-color:#e0a23a}
@media(max-width:760px){.st-left .side .fact{text-align:left!important}}.baglist li.todo .bn{color:var(--mute)}
.baglist .none{color:var(--mute);padding:14px 4px;border:0;font-size:14px}
.confirm{height:72px;font-size:22px;font-weight:600;border-radius:12px;width:100%}
.skurow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.skurow.on{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.skurow .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.skurow .ln{display:flex;justify-content:space-between;margin:5px 0;font-size:14px}
.skurow .ln b{font-family:var(--mono)}
.bar{display:block;height:6px;background:var(--gray);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary)}
.bar.done>i{background:var(--ok)}
.lotrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.lotrow.on{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.lotrow .l1{display:flex;justify-content:space-between;align-items:center}
.lotrow .l1 b{font-family:var(--mono);font-size:15px}
.lotrow .l1 span{color:var(--mute);font-size:13px}
.lotrow .pt{display:block;margin-top:4px;font-size:13px;font-weight:600;color:var(--warn)}
.loose{display:grid;gap:10px}
.lstep{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:17px}
.lstep .no{width:28px;height:28px;border-radius:50%;background:var(--gray);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mute)}
.lstep.cur .no{background:var(--primary);color:#fff}
.lstep.done .no{background:var(--ok-bg);color:var(--ok)}
.lstep .val{font-family:var(--mono);font-weight:700;font-size:20px;text-align:right}
.lstep .sub{display:block;font-size:13px;color:var(--mute)}
.need{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.need b{font-family:var(--mono);font-size:24px}


/* labels page */
.a5wrap{display:grid;gap:16px;justify-content:start}
.a5h{font-weight:600;margin-top:8px}
.a5{width:210mm;height:148mm;background:#fff;border:1px solid #bbb;padding:12mm;display:grid;grid-template-columns:minmax(0,1fr) 62mm;overflow:hidden;gap:8mm;align-items:center;color:#000;break-inside:avoid}
.a5t{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:18pt;line-height:1.75;white-space:nowrap}
.a5q{display:grid;justify-items:center;gap:2mm}
.a5q svg{width:58mm;height:58mm;display:block}
.a5b{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20pt}
.a5o{font-size:10pt}
@media(max-width:820px){.a5{zoom:.42}}
@page{size:A5 landscape;margin:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tlabel{background:#fff;border:1px solid #bbb;border-radius:4px;padding:10px;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;break-inside:avoid}
.tq svg{width:120px;height:120px;display:block}
.tn{font-weight:700;font-size:15px;line-height:1.15}
.ts{font-size:12px;color:#333}
.tb{font-family:var(--mono);font-weight:700;font-size:20px;margin-top:4px}
@media print{.rail,.top,.crumb,.hd,.sim{display:none!important}.content{padding:0;overflow:visible}.shell{display:block;height:auto}.tgrid{display:block}.tlabel{width:100mm;height:75mm;border:0;page-break-after:always;grid-template-columns:38mm 1fr}.tq svg{width:36mm;height:36mm}.a5wrap{display:block}.a5h{display:none}.a5{border:0;page-break-after:always;zoom:1}.a5:last-child{page-break-after:auto}}
/* camera scanner: full screen on the phone */
.cam{position:fixed;inset:0;z-index:80;background:#111;display:flex;flex-direction:column;color:#fff}
.camtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#111}
.camtop b{font-size:16px}
.camtop button{background:#333;color:#fff;height:36px;font-size:14px}
.camview{position:relative;flex:1;min-height:180px;overflow:hidden;background:#000}
.camview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camframe{position:absolute;top:50%;left:50%;width:min(62vw,260px);height:min(62vw,260px);transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.camres{padding:14px 16px;min-height:150px;display:grid;align-content:center;gap:2px;text-align:center;background:#2a2a2a;transition:background .15s}
.camres.ok{background:var(--ok)}.camres.warn{background:#B7791F}.camres.bad{background:var(--bad)}
.camres .crt{font-size:22px;font-weight:700;line-height:1.2}
.camres .crb{font-family:var(--mono);font-size:52px;font-weight:700;line-height:1.05}
.camres .crl{font-size:16px;opacity:.95}
.camres .crx{justify-self:center;margin-top:8px;height:40px;font-size:15px;background:#fff;color:var(--bad);font-weight:600}
.camcnt{display:flex;justify-content:space-around;gap:8px;padding:10px 12px;background:#1b1b1b;text-align:center}
.camcnt div{display:grid}.camcnt span{font-size:12px;color:#aaa}.camcnt b{font-family:var(--mono);font-size:22px}
.cambot{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#111}
.camkg{font-size:18px;font-weight:700;min-width:90px}
.camsim{background:#333;color:#ddd;height:48px;font-size:12px;border:1px dashed #777;white-space:normal;line-height:1.1;flex:0 1 110px}
.camok{flex:1;height:52px;font-size:18px;font-weight:600}
.camb{background:var(--card);border-color:var(--primary);color:var(--primary-ink)}
/* station mode: full screen at the scale */
body.kiosk .rail,body.kiosk .side-card{display:none}
body.kiosk .scale .kg{font-size:150px}

/* simulator (not part of the real screen) */
.sim{position:fixed;left:236px;right:0;bottom:0;height:var(--simh);display:flex;gap:20px;align-items:center;background:#fff;border-top:1px dashed #9AA0A6;padding:0 16px;font-size:12px;color:var(--mute);z-index:50;overflow-x:auto}
body.kiosk .sim{left:0}
.sim .g{display:flex;gap:6px;align-items:center}
.sim .g b{font-weight:600;color:var(--ink)}
.sim button{height:28px;font-size:12px;padding:0 9px;background:#fff;border-color:var(--input)}
#flash{position:fixed;inset:0;border:12px solid var(--bad);pointer-events:none;opacity:0;z-index:100}
#flash.on{animation:fl 1s steps(1,end)}
@keyframes fl{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none;opacity:1}}
@media (max-width:1100px){.station{grid-template-columns:1fr}.detgrid{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.rail{display:none}.sim{left:0}.content{padding:16px 16px 90px}.scale{grid-template-columns:1fr;padding:12px 14px}.scale .kg{font-size:64px}.scale .side{justify-items:start;grid-auto-flow:column;justify-content:start}.scale .facts{gap:14px 20px}.fact .v{font-size:18px}.fact .v.big{font-size:22px}.lblrow{grid-template-columns:1fr}.lblrow>div:last-child{justify-items:start!important;display:flex!important;gap:6px}.lab{width:100%}.top .b-out{display:none}.hd .ttl{font-size:18px}.card{padding:12px}.baglist li{font-size:15px;gap:8px}.lstep{font-size:15px;grid-template-columns:28px 1fr}.lstep .val{grid-column:2;text-align:left;font-size:16px}.alert{font-size:15px}.alert.bad{font-size:17px}.confirm{height:60px;font-size:19px}.station{grid-template-columns:minmax(0,1fr)}}
.ti{min-width:0}.ts,.tn{overflow-wrap:anywhere}
</style>

const rSku=c=>S.skus.find(s=>s.code===c);
const rDoneBags=c=>S.batches.filter(b=>b.sku===c).reduce((a,b)=>a+b.bags.length,0);
const rMissing=c=>{const s=rSku(c),u=rUsed(c),m=[];for(let i=1;i<=s.expBags;i++)if(!u.has(i))m.push(i);return m};
const rScanned=c=>rDoneBags(c)+S.cur.bags.filter(x=>!x.wrong&&x.sku===c).length;
const rDoneKg=c=>S.batches.filter(b=>b.sku===c).reduce((a,b)=>a+b.kg,0);
const rUsed=c=>{const u=new Set();S.batches.filter(b=>b.sku===c).forEach(b=>b.bags.forEach(x=>u.add(x.no)));S.cur.bags.filter(x=>x.sku===c).forEach(x=>u.add(x.no));return u};
const rTag=(c,no)=>`${S.id}|${S.lot}|${c}|${nn(no)}`;
const rLabel=x=>nn(x.no)+"/"+nn(rSku(x.sku).expBags);
const okBags=()=>S.cur.bags.filter(x=>!x.wrong);
const hasWrong=()=>S.cur.bags.some(x=>x.wrong);
const rKpb=()=>{const n=okBags().length;return n?SC.kg/n:null};
const rKpbOff=()=>{const v=rKpb();return SC.stable&&v!==null&&(v<KPB_MIN||v>KPB_MAX)};
const rLocked=()=>S.status!=="weigh";
const rCanPress=()=>!rLocked()&&SC.stable&&SC.kg>0&&okBags().length>0&&!hasWrong();
function rPrint(c){const s=rSku(c);if(!s)return;s.printed=s.expBags;window.open("#/labels/"+S.id+"/"+S.skus.indexOf(s),"_blank");if(S.status==="labels"&&S.skus.every(x=>x.printed>=x.expBags))S.status="weigh";render()}
function rExtra(c){const s=rSku(c);if(s){s.extra=true;render()}}
function rScan(code){
 if(rLocked()){if(S.status==="labels"){beep(1);setAlert("warn",t("printFirst"));render()}return}
 const p=String(code).trim().split("|");if(p.length<4)return;
 if(p[0]!==S.id){beep(2);flash();setAlert("bad",t("otherRc").replace("{id}",p[0]));render();return}
 const sku=p[2],no=parseInt(p[3],10),s=rSku(sku);if(!s)return;
 if(no>s.printed){beep(1);setAlert("warn",t("notPrinted"));render();return}
 if(rUsed(sku).has(no)){beep(1);setAlert("warn",t("dup")+": "+nn(no));render();return}
 S.cur.ask=false;S.cur.sku=sku;
 const bag={sku,no,wrong:false};S.cur.bags.unshift(bag);
 setAlert("ok",t("scanned")+": "+rLabel(bag)+" · "+short(sku));
 render();
}
function rRemove(i){const r=S.cur.bags.splice(i,1)[0];if(r)S.removed.push({sku:r.sku,no:r.no,at:new Date().toISOString()});S.cur.ask=false;S.cur.sku=S.cur.bags.length?S.cur.bags[0].sku:null;if(!hasWrong()&&ALERT&&ALERT.type==="bad")ALERT=null;render()}
function rConfirm(){
 if(!rCanPress())return;
 if(rKpbOff()){S.cur.ask=true;beep(1);render();return}
 const kg=r1(SC.kg),all=S.cur.bags.slice().reverse(),codes=[...new Set(all.map(x=>x.sku))],tm=now(),first=S.batches.length+1;
 let left=kg;   // several SKUs in one weighing: split the scale kg by bag count, last SKU takes the rounding rest
 codes.forEach((c,i)=>{const bags=all.filter(x=>x.sku===c),part=i===codes.length-1?r1(left):r1(kg*bags.length/all.length);left-=part;
  S.batches.push({id:S.batches.length+1,time:tm,sku:c,bags,kg:part,pend:false,split:codes.length>1})});
 const last=S.batches.length;
 S.cur={sku:null,bags:[],appr:false,ask:false};setAlert("ok",t("batchDone")+" #"+(first===last?first:first+"–"+last)+" · "+fmt(kg)+" kg");render();
}
function rUndo(){const b=S.batches[S.batches.length-1];if(!b||b.pend||rLocked())return;b.pend=true;setAlert("warn",t("undoReq")+" (#"+b.id+")");render()}
function rSend(){
 if(rLocked())return;
 if(S.cur.bags.length){setAlert("bad",t("openBatch"));render();return}
 const miss=S.skus.map(s=>({c:s.code,m:s.expBags-rDoneBags(s.code)})).filter(x=>x.m>0);
 if(miss.length){setAlert("bad",t("missing")+": "+miss.map(x=>{const m=rMissing(x.c);return short(x.c)+" "+x.m+(m.length&&m.length<=10?" ("+m.map(nn).join(", ")+")":"")}).join(" · "));render();return}
 const exp=S.skus.reduce((a,s)=>a+s.expKg,0),got=S.skus.reduce((a,s)=>a+rDoneKg(s.code),0),d=(got-exp)/exp*100;
 if(d<-0.5||d>0){S.status="mgr";setAlert("warn-fixed",t("outTol")+" ("+pct(d)+")")}else{S.status="buying";setAlert("ok-fixed",t("sentBuy")+" ("+pct(d)+")")}

}

const keyOf=(lot,no)=>lot+"|"+no;
const xTag=(L,b)=>`${L.grn}|${L.lot}|${L.sku}|${nn(b.no)}`;
const xLabel=x=>nn(x.no)+"/"+nn(lotOf(x.lot).exp);
const short=c=>c.replace(/^CF_/,"").split("_").filter((x,i,a)=>!(i===a.length-1&&/^G\d$/.test(x.trim()))).join(" ").replace(/\s+/g," ").trim();   // drop CF_ and grade, keep bean size
const lineOf=c=>S.lines.find(l=>l.sku===c);
const lotsOf=c=>LOTS.filter(L=>L.sku===c);
const xInCur=k=>S.cur.bags.some(x=>x.key===k);
const xTaken=k=>S.used.has(k)||S.cur.bags.some(x=>x.key===k&&!x.wrong);
const fullLeft=L=>L.bags.filter(b=>!b.partial&&!xTaken(keyOf(L.lot,b.no)));
const partsOf=c=>lotsOf(c).flatMap(L=>partLeft(L).map(b=>({lot:L.lot,no:b.no,kg:b.kg,exp:L.exp})));
const partLeft=L=>L.bags.filter(b=>b.partial&&b.kg>0.05&&!S.used.has(keyOf(L.lot,b.no)));
const assignedLot=c=>{const L=lotsOf(c).find(L=>fullLeft(L).length>0);return L?L.lot:null};
const looseLot=c=>{const L=lotsOf(c).find(L=>partLeft(L).length||fullLeft(L).length);return L?L.lot:null};
const wholeDone=c=>S.batches.filter(b=>b.type==="batch"&&b.sku===c).reduce((a,b)=>a+b.bags.length,0);
const looseDoneKg=c=>S.batches.filter(b=>b.type==="loose"&&b.sku===c).reduce((a,b)=>a+b.kg,0);
const lineKg=l=>l.whole*60+l.looseKg;
const slipKg=X=>X.lines.reduce((a,l)=>a+lineKg(l),0);
const totalDone=()=>S.batches.reduce((a,b)=>a+b.kg,0);
const xNeedLoose=c=>{const l=lineOf(c);return l?Math.max(0,r1(l.looseKg-looseDoneKg(c))):0};
const wholeLine=()=>S.lines.find(l=>wholeDone(l.sku)<l.whole);   // next line still needing whole bags
const looseLine=()=>S.lines.find(l=>xNeedLoose(l.sku)>0);
const xKpb=()=>{const n=okBags().length;return n?SC.kg/n:null};
const xKpbOff=()=>{const v=xKpb();return SC.stable&&v!==null&&(v<KPB_MIN||v>KPB_MAX)};
const xLocked=()=>S.status!=="ship";
const xCanPress=()=>!xLocked()&&S.mode==="whole"&&SC.stable&&SC.kg>0&&okBags().length>0&&!hasWrong();
const srcBag=()=>S.src?lotOf(S.src.lot).bags.find(b=>b.no===S.src.no):null;
function xMode(m){if(xLocked())return;if(S.cur.bags.length&&m==="loose"){setAlert("bad",t("openBatch"));render();return}S.mode=m;S.src=null;ALERT=null;render()}
function xScan(code){
 if(xLocked())return;
 const p=String(code).trim().split("|");if(p.length<4)return;
 const L=lotOf(p[1]);if(!L||L.sku!==p[2])return;
 const no=parseInt(p[3],10),st=L.bags.find(b=>b.no===no);if(!st)return;
 const key=keyOf(L.lot,no),line=lineOf(L.sku);
 if(S.used.has(key)||xInCur(key)||(S.src&&S.src.key===key)){beep(1);setAlert("warn",t("dup")+": "+L.lot+" "+nn(no));render();return}
 if(S.mode==="loose"){
  if(!line||xNeedLoose(L.sku)<=0){beep(2);flash();setAlert("bad",t("noLoose")+": "+short(L.sku));render();return}
  const ll=looseLot(L.sku),pt=partsOf(L.sku);
  if(!st.partial&&pt.length){beep(2);flash();setAlert("bad",t("mustPartial").replace("{b}",pt[0].lot+" "+nn(pt[0].no)+" · "+fmt(pt[0].kg)+" kg"));render();return}
  S.src={lot:L.lot,no,key,sku:L.sku};
  if(!st.partial&&ll&&L.lot!==ll){beep(1);setAlert("warn",t("olderLot").replace("{l}",ll))}else ALERT=null;
  render();return;
 }
 if(st.partial){beep(1);setAlert("warn",t("isPartial"));render();return}
 S.cur.ask=false;
 const need=assignedLot(L.sku);
 const wrong=!line||line.whole<=0?"sku":null;
 if(!wrong)S.cur.sku=L.sku;
 const bag={key,lot:L.lot,sku:L.sku,no,wrong,need,exc:null};S.cur.bags.unshift(bag);
 if(wrong){beep(2);flash();ALERT=null}
 else if(need&&L.lot!==need){beep(1);setAlert("warn",t("olderLot").replace("{l}",need)+" · "+xLabel(bag))}
 else setAlert("ok",t("scanned")+": "+short(L.sku)+" · "+xLabel(bag));
 render();
}
function xRemove(i){const r=S.cur.bags.splice(i,1)[0];if(r){S.removed.push({key:r.key,at:new Date().toISOString()});if(S.exc&&S.exc.key===r.key)S.exc=null}S.cur.ask=false;if(!S.cur.bags.length)S.cur.sku=null;render()}
function xReqExc(){const w=S.cur.bags.find(x=>x.wrong==="lot"&&!x.exc);if(w){S.exc={key:w.key,reason:""};render()}}
function xReason(v){if(S.exc){S.exc.reason=v;render()}}
function xSendExc(){if(!S.exc||!S.exc.reason)return;const b=S.cur.bags.find(x=>x.key===S.exc.key);if(b){b.exc="pending";S.excLog.push({key:b.key,need:b.need,reason:S.exc.reason,at:new Date().toISOString()})}S.exc=null;setAlert("warn",t("sentMgr"));render()}
function xReq(){if(!xLocked()&&xKpbOff()){S.cur.appr=true;render()}}
function xConfirm(){
 if(!xCanPress())return;
 const all=S.cur.bags.slice().reverse(),codes=[...new Set(all.map(x=>x.sku))];
 for(const c of codes){const l=lineOf(c),left=l.whole-wholeDone(c),n=all.filter(x=>x.sku===c).length;if(n>left){beep(1);setAlert("bad",short(c)+": "+t("tooMany").replace("{n}",left));render();return}}
 if(xKpbOff()){S.cur.ask=true;beep(1);render();return}
 const kg=r1(SC.kg),tm=now(),first=S.batches.length+1;let rest=kg;
 all.forEach(x=>S.used.add(x.key));
 codes.forEach((c,i)=>{const bags=all.filter(x=>x.sku===c),part=i===codes.length-1?r1(rest):r1(kg*bags.length/all.length);rest-=part;   // several SKUs on the scale: split kg by bag count
  S.batches.push({id:S.batches.length+1,type:"batch",sku:c,time:tm,bags,kg:part,pend:false,split:codes.length>1})});
 const last=S.batches.length;
 S.cur={sku:null,bags:[],appr:false,ask:false};setAlert("ok",t("batchDone")+" #"+(first===last?first:first+"–"+last)+" · "+fmt(kg)+" kg");render();
}
function xCanLoose(){return !xLocked()&&S.mode==="loose"&&S.src&&SC.stable&&SC.kg>0}
function xLooseConfirm(){
 if(!xCanLoose())return;
 const L=lotOf(S.src.lot),b=srcBag(),kg=r1(SC.kg),need=xNeedLoose(S.src.sku);
 if(kg>b.kg+0.05){beep(1);setAlert("bad",t("tooMuch")+" ("+fmt(b.kg)+" kg)");render();return}
 if(kg>need+slipKg(S)*EXP_TOL_PCT/100){beep(1);setAlert("bad",t("overNeed").replace("{k}",fmt(need)));render();return}
 b.kg=r1(b.kg-kg);b.partial=true;   // same tag; bag becomes a partial bag and stays in stock
 if(b.kg<=0.05)S.used.add(S.src.key);
 const id=S.batches.length+1;
 S.batches.push({id,type:"loose",sku:S.src.sku,time:now(),bags:[{lot:L.lot,no:b.no}],kg,pend:false});
 const still=xNeedLoose(S.src.sku);
 setAlert("ok",t("looseDone").replace("{k}",fmt(kg)).replace("{b}",L.lot+" "+nn(b.no)).replace("{r}",fmt(b.kg))+(still>0?" · "+t("stillNeed").replace("{k}",fmt(still)):""));
 S.src=null;SC.onScale=[];reweigh();
}
function xUndo(){const b=S.batches[S.batches.length-1];if(!b||b.pend||xLocked())return;b.pend=true;setAlert("warn",t("undoReq")+" (#"+b.id+")");render()}
function xSend(){
 if(xLocked())return;
 if(S.cur.bags.length||S.src){setAlert("bad",t("openBatch"));render();return}
 const miss=S.lines.map(l=>{const m=l.whole-wholeDone(l.sku),k=xNeedLoose(l.sku);return m>0||k>0.5?short(l.sku)+(m>0?" "+m+" "+t("bags").toLowerCase():"")+(k>0.5?" "+fmt(k)+" kg":""):null}).filter(Boolean);
 if(miss.length){setAlert("bad",t("missing")+": "+miss.join(", "));render();return}
 const exp=slipKg(S),d=(totalDone()-exp)/exp*100;
 S.status="mgr";
 if(Math.abs(d)>EXP_TOL_PCT)setAlert("warn-fixed",t("outTol")+" ("+pct(d)+")");else setAlert("ok-fixed",t("sentMgr")+" ("+pct(d)+")");
 render();
}

/* ---------- simulator ---------- */
function putBags(n){for(let i=0;i<n;i++)SC.onScale.push(bagW());reweigh()}
/* customer bag after pouring: the scale shows net kg (customer bag tared on the scale) */
function putCust(){let need=30;if(VIEW.name==="slip"&&S.src){need=xNeedLoose(S.src.sku);const b=srcBag();if(b&&b.kg<need)need=b.kg-0.05}SC.onScale=[Math.max(0.5,r1(need+(Math.random()-.5)*0.1))];reweigh()}
function removeAll(){
 SC.onScale=[];SC.tare=0;
 if(S&&S.cur&&S.cur.bags.length){S.cur.bags.forEach(r=>S.removed.push({key:r.key||r.no,at:new Date().toISOString()}));S.cur.bags=[];S.cur.sku=null;if(S.exc)S.exc=null}
 if(ALERT&&ALERT.type==="bad")ALERT=null;reweigh();
}
function rNext(c){const s=rSku(c);if(!s)return null;const u=rUsed(c);for(let i=1;i<=s.expBags;i++)if(!u.has(i))return i;return null}
function xNextFull(L){return L.bags.find(b=>!b.partial&&!xTaken(keyOf(L.lot,b.no))&&!xInCur(keyOf(L.lot,b.no))&&!(S.src&&S.src.key===keyOf(L.lot,b.no)))}
function scanSku(c){
 if(VIEW.name==="receipt"){const n=rNext(c);if(n)rScan(rTag(c,n));return}
 if(VIEW.name!=="slip")return;
 const l=S.mode==="loose"?looseLot(c):assignedLot(c);if(!l)return;const L=lotOf(l),b=xNextFull(L);if(b)xScan(xTag(L,b));
}
function scanPartial(){const ln=looseLine();const c=ln?ln.sku:ROB;const l=looseLot(c);if(!l)return;const L=lotOf(l),b=partLeft(L)[0];if(b)xScan(xTag(L,b))}
function scanWrongLot(){for(const l of S.lines){const c=l.sku,a=S.mode==="loose"?looseLot(c):assignedLot(c),ls=lotsOf(c),i=ls.findIndex(x=>x.lot===a),L=ls.slice(i+1).find(x=>xNextFull(x));if(L){xScan(xTag(L,xNextFull(L)));return}}}   // a bag from a newer lot of any SKU on the slip
function scanDup(){
 if(VIEW.name==="receipt"){const b=okBags()[0]||(S.batches.length&&S.batches[S.batches.length-1].bags.slice(-1)[0]);if(b)rScan(rTag(b.sku,b.no));return}
 const b=okBags()[0]||(S.batches.filter(x=>x.type==="batch").slice(-1)[0]||{bags:[]}).bags.slice(-1)[0];if(b){const L=lotOf(b.lot);xScan(xTag(L,b))}
}

/* ---------- routing ---------- */
function go(h){location.hash=h}
function route(){
 const h=location.hash.replace(/^#\/?/,"").split("/");
 ALERT=null;
 if(h[0]==="receipt"&&RC[h[1]]){VIEW={name:"receipt",id:h[1]};S=RC[h[1]]}
 else if(h[0]==="labels"&&(RC[h[1]]||XS[h[1]])){VIEW={name:"labels",id:h[1],k:h[2]};S=null}
 else if(h[0]==="stock"&&STS[h[1]]){VIEW={name:"stock",id:h[1]};S=STS[h[1]]}
 else if(h[0]==="slip"&&XS[h[1]]){VIEW={name:"slip",id:h[1]};S=XS[h[1]]}
 else{VIEW={name:h[0]||"receiving"};S=null}
 if(!S)document.body.classList.remove("kiosk");
 SC.onScale=[];SC.tare=0;SC.target=0;SC.kg=0;SC.settle=0;SC.stable=true;
 render();
}
window.addEventListener("hashchange",()=>{if(CAM.on)camClose();route()});

const ST={labels:["stLabels","warn"],weigh:["stWeigh","blue"],buying:["stBuying",""],acc:["stAcc",""],mgr:["stMgr","warn"],stock:["stStock","ok"],ship:["stShip","blue"],shipped:["stShipped","ok"]};

function stableHTML(){return (SC.stable?`<span class="chip ok">${t("stable")}</span>`:`<span class="chip warn">${t("unstable")}</span>`)+(SC.tare?`<span class="chip mute">${t("tared")} ${fmt(SC.tare,2)}</span>`:"")}
function qrSVG(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=21,sz=76/n;let r="";const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h%100};
 const finder=(x,y)=>`<rect x="${x*sz}" y="${y*sz}" width="${7*sz}" height="${7*sz}" fill="#000"/><rect x="${(x+1)*sz}" y="${(y+1)*sz}" width="${5*sz}" height="${5*sz}" fill="#fff"/><rect x="${(x+2)*sz}" y="${(y+2)*sz}" width="${3*sz}" height="${3*sz}" fill="#000"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(rnd()<48)r+=`<rect x="${x*sz}" y="${y*sz}" width="${sz}" height="${sz}" fill="#000"/>`}
 return `<svg viewBox="0 0 76 76" aria-hidden="true">${finder(0,0)}${finder(14,0)}${finder(0,14)}${r}</svg>`}
function alertBox(extra){

 if(extra)return extra;

 return `<div class="alert empty" role="status">&nbsp;</div>`;
}

 return `<div class="sim" role="group" aria-label="${t("simLbl")}">${t("simLbl")}<div class="g"><b>${t("simScale")}:</b>${sc}<button onclick="removeAll()">${t("removeAll")}</button></div><div class="g"><b>${t("simScanner")}:</b>${sn}</div></div>`;
}

/* ---------- QR labels page + phone camera scanner ---------- */
function qrReal(text){
 if(typeof qrcode!=="function")return qrSVG(text);
 const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});
}

}

/* ---------- stocktake: whole warehouse every Friday, scan every bag and weigh by batch (like receiving) ---------- */
const KK_TOL=0.5;                                   // % kg gap per order+SKU+lot that needs a reason
const GHOST="PH-OD-62|300926AP|CF_ARABICA _S16_WP_G2|017";   // label of a bag already shipped
const STS={};let ST_SEQ=1,STOCK=null;
const stOpenOne=()=>Object.values(STS).some(s=>s.status!=="done");
function stockBags(){                               // sample stock: the 3 purchase orders, already received
 if(STOCK)return STOCK;STOCK=[];let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
 Object.values(RC).forEach(R=>R.skus.forEach(s=>{for(let i=1;i<=s.expBags;i++)STOCK.push({key:R.id+"|"+s.code+"|"+i,rc:R.id,lot:R.lot,sku:s.code,no:i,exp:s.expBags,kg:Math.round((59.6+rnd()*0.4)*100)/100})}));
 return STOCK;
}
const grpOf=b=>b.rc+"|"+b.sku;
const stKey=p=>p[0]+"|"+p[2]+"|"+parseInt(p[3],10);
function stOpen(){
 if(stOpenOne())return;
 const id="KK-2711-"+String(ST_SEQ++).padStart(2,"0");
 STS[id]={id,status:"count",opened:now(),snap:stockBags().filter(b=>b.kg>0.05).map(b=>({...b})),batches:[],cur:{sku:null,bags:[],ask:false},removed:[],notStock:[],why:{}};
 go("/stock/"+id);
}
const stWeighed=()=>{const w=new Set();S.batches.forEach(bt=>bt.bags.forEach(x=>w.add(x.key)));return w};
const stCanPress=()=>S.status==="count"&&SC.stable&&SC.kg>0&&S.cur.bags.length>0;
function stScan(code){
 if(S.status!=="count")return;
 const p=String(code).trim().split("|");if(p.length<4)return;
 const key=stKey(p),b=S.snap.find(x=>x.key===key);
 if(!b){beep(2);flash();if(!S.notStock.includes(code))S.notStock.push(code);setAlert("bad",t("notInStock")+": "+p[0]+" · "+nn(parseInt(p[3],10)));render();return}
 if(S.cur.bags.some(x=>x.key===key)||stWeighed().has(key)){beep(1);setAlert("warn",t("stDup")+": "+nn(b.no)+"/"+nn(b.exp)+" · "+short(b.sku));render();return}
 S.cur.sku=b.sku;S.cur.bags.unshift({key,sku:b.sku,no:b.no,exp:b.exp,g:grpOf(b),wrong:false});
 setAlert("ok",t("scanned")+": "+nn(b.no)+"/"+nn(b.exp)+" · "+short(b.sku));render();
}
function stRemove(i){const r=S.cur.bags.splice(i,1)[0];if(r)S.removed.push({key:r.key,at:new Date().toISOString()});S.cur.sku=S.cur.bags.length?S.cur.bags[0].sku:null;render()}
function stConfirm(){
 if(!stCanPress())return;
 const kg=r1(SC.kg),all=S.cur.bags.slice().reverse(),gs=[...new Set(all.map(x=>x.g))],tm=now(),first=S.batches.length+1;let left=kg;
 gs.forEach((g,i)=>{const bags=all.filter(x=>x.g===g),part=i===gs.length-1?r1(left):r1(kg*bags.length/all.length);left-=part;
  S.batches.push({id:S.batches.length+1,time:tm,g,sku:bags[0].sku,bags,kg:part,split:gs.length>1})});
 const last=S.batches.length;S.cur={sku:null,bags:[],ask:false};
 setAlert("ok",t("batchDone")+" #"+(first===last?first:first+"–"+last)+" · "+fmt(kg)+" kg");render();
}
function stGroups(X){
 X=X||S;const w=new Set(),gkg={};X.batches.forEach(bt=>{bt.bags.forEach(x=>w.add(x.key));gkg[bt.g]=(gkg[bt.g]||0)+bt.kg});
 const G={};X.snap.forEach(b=>{const g=grpOf(b),o=G[g]||(G[g]={g,rc:b.rc,lot:b.lot,sku:b.sku,sys:0,sysKg:0,found:0,foundSysKg:0,missing:[]});
  o.sys++;o.sysKg+=b.kg;if(w.has(b.key)){o.found++;o.foundSysKg+=b.kg}else o.missing.push(b.no)});
 return Object.values(G).map(o=>{o.kg=r1(gkg[o.g]||0);o.diffKg=o.kg-o.foundSysKg;o.diffPct=o.foundSysKg?o.diffKg/o.foundSysKg*100:0;o.kgOff=o.found>0&&Math.abs(o.diffPct)>KK_TOL;o.needWhy=o.missing.length>0||o.kgOff;return o});
}
function stEnd(){if(S.status!=="count")return;if(S.cur.bags.length){setAlert("bad",t("openBatch"));render();return}S.status="review";ALERT=null;render()}

 const w=stWeighed(),G={};stGroups().forEach(o=>G[o.g]=o);
 STOCK=STOCK.filter(b=>w.has(b.key));                                    // missing bags leave stock
 STOCK.forEach(b=>{const o=G[grpOf(b)];if(o&&o.foundSysKg)b.kg=Math.round(b.kg*o.kg/o.foundSysKg*100)/100});   // kg follows the scale

 SC.onScale=[];SC.kg=0;SC.target=0;ALERT=null;render();
}

  return `<div class="wrow"><span class="dot ${r.status==="weigh"?"blue":""}"></span><span class="tx">${txt}</span><button class="b-pri" onclick="go('/receipt/${r.id}')">${r.status==="labels"?t("receive"):t("cont")}</button></div>`}).join("");
 const all=rs.map(r=>`<tr><td><a href="#/receipt/${r.id}"><b>${r.id}</b></a></td><td>${r.skus.map(x=>esc(x.code)).join("<br>")}</td><td class="r num">${r.skus.reduce((a,x)=>a+x.expBags,0)}</td><td class="r num">${fmt(r.skus.reduce((a,s)=>a+s.expKg,0),0)}</td><td>${pill(r.status)}</td></tr>`).join("")
  +OTHER_RC.map(r=>`<tr><td><b>${r.id}</b></td><td>${r.po}</td><td>–</td><td class="r num">${fmt(r.kg,0)}</td><td>${pill(r.status)}</td></tr>`).join("");
 return `<div class="page-h">${t("goodsIn")}</div><p class="page-d">${t("goodsInD")}</p>
  <div class="card"><h3>${t("waiting")} · ${rs.filter(r=>r.status==="labels"||r.status==="weigh").length}</h3>${wait||`<div class="empty">–</div>`}</div>
  <div class="card"><h3>${t("receipts")}</h3><table class="tbl"><thead><tr><th>#</th><th>SKU</th><th class="r">${t("bags")}</th><th class="r">kg</th><th></th></tr></thead><tbody>${all}</tbody></table></div>`;
}
function pReceipt(){
 const R=S,n=okBags().length,lockLbl=R.status==="labels";
 const labels=R.skus.map(s=>`<div class="lblrow"><div><div class="sku">${s.code}</div><div class="sub">${R.lot} · <span class="num">${s.printed}/${s.expBags}</span> ${t("printed")}</div></div>
  <div class="lab">${qrSVG(R.id+s.code)}<div><div class="s">${s.code.replace(/_/g," ")}</div><div class="l">${R.id} · ${R.lot}</div><div class="n">001/${nn(s.expBags)}</div></div></div>
  <div style="display:grid;gap:6px;justify-items:end">${s.printed<s.expBags?`<button class="b-pri" onclick="rPrint('${s.code}')">${t("printAll").replace("{n}",s.expBags)}</button>`:`<button class="b-out" onclick="window.open('#/labels/${R.id}/${R.skus.indexOf(s)}','_blank')">${t("viewLabels")}</button>${s.extra?`<span class="pill warn">${t("extraSent")}</span>`:`<button class="b-out" onclick="rExtra('${s.code}')">${t("extra")}</button>`}`}</div></div>`).join("");
 let ex="";
 const w=R.cur.bags.find(x=>x.wrong);
 if(ALERT&&ALERT.type==="bad")ex="";
 else if(w)ex=`<div class="alert bad" role="status"><span class="msg">${esc(t("wrongSku")+": "+w.sku+" "+rLabel(w))}</span></div>`;
 else if(rKpbOff()&&R.cur.ask&&!rLocked())ex=`<div class="alert warn" role="status"><span class="msg">${esc(t("kpbOff").replace("{v}",fmt(rKpb(),1)))}</span>${R.cur.appr?`<span class="pill warn">${t("pending")}</span>`:`<button onclick="rReq()">${t("reqAppr")}</button>`}</div>`;
 const bags=R.cur.bags.length?R.cur.bags.map((x,i)=>`<li class="${x.wrong?"wrong":""}"><span class="bn">${rLabel(x)}</span><span class="bs">${x.wrong?t("wrongSku")+" · ":""}${x.sku}</span><button class="${x.wrong?"b-bad":"b-out"}" onclick="rRemove(${i})">${t("remove")}</button></li>`).join(""):`<li class="none">${t("noBags")}</li>`;
 const prog=R.skus.map(s=>{const b=rScanned(s.code),k=rDoneKg(s.code);return `<div class="skurow ${s.code===R.cur.sku?"on":""}"><span class="nm">${s.code}${b>=s.expBags?`<span class="pill ok">${s.expBags}/${s.expBags}</span>`:""}</span>
  <span class="ln"><span>${t("bags")}</span><b>${b} / ${s.expBags}</b></span><span class="bar ${b>=s.expBags?"done":""}"><i style="width:${Math.min(100,b/s.expBags*100)}%"></i></span>
  <span class="ln"><span>${t("kg")}</span><b>${fmt(k)} / ${fmt(s.expKg,0)}</b></span>${(()=>{const m=rMissing(s.code);return m.length&&m.length<=10?`<span class="miss">${t("stillMissing")}: <b class="num">${m.map(nn).join(", ")}</b></span>`:""})()}</div>`}).join("");
 const rows=R.batches.slice().reverse().map(b=>`<tr class="${b.pend?"pend":""}"><td class="num">#${b.id}</td><td class="num">${b.time}</td><td>${short(b.sku)}${b.split?" *":""}</td><td class="r num">${b.bags.length}</td><td class="r num">${fmt(b.kg)}</td><td>${b.pend?t("pending"):""}</td></tr>`).join("");
 const det=R.skus.map(s=>`<div class="skuhd">${s.code}</div><div class="detgrid">
  <div class="fld"><label>${t("shelf")}</label><input value="${esc(s.shelf)}" onchange="rSku('${s.code}').shelf=this.value"></div>
  <div class="fld"><label>${t("slot")}</label><input placeholder="${t("asOnBags")}" value="${esc(s.slot)}" onchange="rSku('${s.code}').slot=this.value"></div>
  <div class="fld"><label>${t("made")}</label><input type="date" value="${esc(s.made)}" onchange="rSku('${s.code}').made=this.value"></div>
  <div class="fld"><label>${t("expires")}</label><input type="date" value="${esc(s.exp)}" onchange="rSku('${s.code}').exp=this.value"></div></div>`).join("");
 return `<div class="crumb"><a href="#/receiving">‹ ${t("receiving")}</a><span>${R.id}</span></div>
 <div class="hd"><span class="ttl">${R.id}</span><span class="meta">${t("lot")} ${R.lot}</span>${pill(R.status)}<span class="sp"></span><button class="camb" onclick="camOpen()" ${rLocked()?"disabled":""}>${t("camScan")}</button><button class="b-pri" onclick="rSend()" ${rLocked()?"disabled":""}>${t("sendBuying")}</button></div>
 <div class="card side-card"><h3>${t("c1")}</h3>${labels}</div>
 <div class="card"><h3>${t("c2")}</h3>
  <div class="station"><div class="st-left">
   <div class="card scale" style="margin:0"><div class="kg"><span id="kg">${fmt(SC.kg)}</span><small>kg</small></div><div class="side" id="stab">${stableHTML()}</div>
    <div class="facts"><div class="fact"><div class="k">${t("batchSku")}</div><div class="v">${(()=>{const c=[...new Set(R.cur.bags.map(x=>x.sku))];return c.length>1?c.length+" SKU":c.length?short(c[0]):"–"})()}</div></div>
    <div class="fact"><div class="k">${t("bagsInBatch")}</div><div class="v num">${n}</div></div>
    <div class="fact"><div class="k">${t("kgPerBag")}</div><div class="v num ${rKpbOff()?"off":""}" id="kpb">${rKpb()===null?"–":fmt(rKpb(),1)}</div></div></div></div>
   ${alertBox(ex)}
   <div class="card bags" style="margin:0"><h3>${t("bagsInBatch")}<span class="num">${n}</span></h3><ul class="baglist">${bags}</ul></div>
   <button class="b-pri confirm" onclick="rConfirm()" ${rCanPress()?"":"disabled"}>${lockLbl?t("printFirst"):t("confirm")}</button>
  </div><div class="st-right">
   <div class="card" style="margin:0"><h3>${t("progress")}</h3>${prog}</div>
   <div class="card" style="margin:0"><h3>${t("batches")} · ${R.batches.length}</h3><div style="max-height:300px;overflow:auto">${batchTable(rows,false)}</div>
    <button class="b-out" style="margin-top:10px" onclick="rUndo()" ${!R.batches.length||R.batches[R.batches.length-1].pend||rLocked()?"disabled":""}>${t("undo")}</button></div>
  </div></div></div>`;
}
function pRelease(){
 const xs=Object.values(XS),skus=X=>X.lines.map(l=>short(l.sku)).join(", ");
 const wait=xs.filter(x=>x.status==="ship").map(x=>`<div class="wrow"><span class="dot red"></span><span class="tx"><b>${x.id}</b> · ${fmt(slipKg(x),0)} kg · ${skus(x)} · ${x.cust}</span><button class="b-pri" onclick="go('/slip/${x.id}')">${t("weighShip")}</button></div>`).join("");
 const all=xs.map(x=>`<tr><td><a href="#/slip/${x.id}"><b>${x.id}</b></a></td><td>${skus(x)}</td><td class="r num">${fmt(slipKg(x),0)}</td><td>${pill(x.status)}</td></tr>`).join("")
  +OTHER_XS.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.sku}</td><td class="r num">${fmt(x.kg,0)}</td><td>${pill(x.status)}</td></tr>`).join("");
 return `<div class="page-h">${t("goodsOut")}</div><p class="page-d">${t("goodsOutD")}</p>
  <div class="card"><h3>${t("waiting")} · ${xs.filter(x=>x.status==="ship").length}</h3>${wait||`<div class="empty">–</div>`}</div>
  <div class="card"><h3>${t("release")}</h3><table class="tbl"><thead><tr><th>#</th><th>SKU</th><th class="r">kg</th><th></th></tr></thead><tbody>${all}</tbody></table></div>`;
}
function pSlip(){
 const X=S,n=okBags().length;
 let ex="";
 if(S.exc&&!xLocked()){const w=X.cur.bags.find(x=>x.key===S.exc.key);const opts=["r1","r2","r3","r4"].map(r=>`<option value="${r}" ${S.exc.reason===r?"selected":""}>${esc(t(r))}</option>`).join("");
  ex=`<div class="alert bad" role="status"><span class="msg">${esc(t("wrongLot")+": "+(w?w.lot+" "+xLabel(w):""))}</span><select aria-label="${t("chooseReason")}" onchange="xReason(this.value)"><option value="" ${S.exc.reason?"":"selected"} disabled>${t("chooseReason")}</option>${opts}</select><button onclick="xSendExc()" ${S.exc.reason?"":"disabled"}>${t("sendReq")}</button></div>`}
 else if(!(ALERT&&(ALERT.type==="bad"||ALERT.type==="warn"))){
  const w=X.cur.bags.find(x=>x.wrong&&!x.exc);
  if(w&&w.wrong==="lot")ex=`<div class="alert bad" role="status"><span class="msg">${esc(t("wrongLot")+": "+w.lot+" "+xLabel(w)+" · "+t("pick")+" "+w.need)}</span><button onclick="xReqExc()">${t("reqExc")}</button></div>`;
  else if(w)ex=`<div class="alert bad" role="status"><span class="msg">${esc(t("wrongSku")+": "+short(w.sku)+(X.cur.sku?" · "+t("batchIs")+" "+short(X.cur.sku):""))}</span></div>`;
  else if(xKpbOff()&&X.cur.ask&&!xLocked())ex=`<div class="alert warn" role="status"><span class="msg">${esc(t("kpbOff").replace("{v}",fmt(xKpb(),1)))}</span>${X.cur.appr?`<span class="pill warn">${t("pending")}</span>`:`<button onclick="xReq()">${t("reqAppr")}</button>`}</div>`;
 }
 /* which SKU / lot the staff works on now */
 let curSku,curLot;
 if(X.mode==="whole"){curSku=X.cur.sku||(wholeLine()||{}).sku;curLot=curSku?assignedLot(curSku):null}
 else{curSku=X.src?X.src.sku:(looseLine()||{}).sku;curLot=curSku?looseLot(curSku):null}
 const pl=X.mode==="loose"&&curSku?partsOf(curSku):[];
 const cl=curSku?lineOf(curSku):null,needTxt=!cl?"–":X.mode==="whole"?(cl.whole-wholeDone(curSku))+" "+t("bags").toLowerCase():fmt(xNeedLoose(curSku))+" kg";
 const bags=X.cur.bags.length?X.cur.bags.map((x,i)=>{const st=x.wrong==="lot"?t("wrongLot")+" · "+x.lot:x.wrong==="sku"?t("wrongSku")+" · "+short(x.sku):short(x.sku)+" · "+x.lot;
  return `<li class="${x.wrong?"wrong":""}"><span class="bn">${xLabel(x)}</span><span class="bs">${esc(st)}</span>${x.exc==="pending"?`<span class="pill warn">${t("pending")}</span>`:""}<button class="${x.wrong?"b-bad":"b-out"}" onclick="xRemove(${i})">${t("remove")}</button></li>`}).join(""):`<li class="none">${t("noBags")}</li>`;
 let work;
 if(X.mode==="whole"){
  work=`<div class="card bags" style="margin:0"><h3>${t("bagsInBatch")}<span class="num">${n}</span></h3><ul class="baglist">${bags}</ul></div>
   <button class="b-pri confirm" onclick="xConfirm()" ${xCanPress()?"":"disabled"}>${t("confirm")}</button>`;
 }else if(!curSku){
  work=`<div class="card" style="margin:0"><div class="empty">${t("noLooseLeft")}</div></div>`;
 }else{
  const src=srcBag(),need=xNeedLoose(curSku),pour=src?Math.min(need,src.kg):null,onSc=X.src&&SC.stable&&SC.kg>0;
  const pourTxt=!src?"–":src.kg<need?t("pourAll").replace("{k}",fmt(src.kg)).replace("{m}",fmt(r1(need-src.kg))):t("pourX").replace("{k}",fmt(pour));
  work=`<div class="card loose" style="margin:0">
   <div class="need"><span>${short(curSku)} · ${t("needKg")}</span><b>${fmt(need)} kg</b></div>
   <div class="lstep ${src?"done":"cur"}"><span class="no">1</span><span>${t("l1")}<span class="sub">${pl.length?t("partialFirst").replace("{n}",pl[0].lot+" "+nn(pl[0].no)+" · "+fmt(pl[0].kg)+" kg"):""}</span></span><span class="val">${src?`${X.src.lot} ${nn(X.src.no)} · ${fmt(src.kg)} kg`:"–"}</span></div>
   <div class="lstep ${src?(onSc?"done":"cur"):""}"><span class="no">2</span><span>${t("l2")}<span class="sub">${esc(pourTxt)}</span></span><span class="val">${onSc?fmt(SC.kg)+" kg":"–"}</span></div>
   <button class="b-pri confirm" onclick="xLooseConfirm()" ${xCanLoose()?"":"disabled"}>${t("l3")}</button></div>`;
 }
 const lineRow=l=>{const w=wholeDone(l.sku),lk=looseDoneKg(l.sku),done=w>=l.whole&&lk>=l.looseKg-0.5;
  return `<div class="skurow ${l.sku===curSku?"on":""}"><span class="nm">${l.sku}${done?`<span class="pill ok">✓</span>`:""}</span>
  <span class="ln"><span>${t("whole")}</span><b>${w} / ${l.whole}</b></span><span class="bar ${w>=l.whole?"done":""}"><i style="width:${l.whole?Math.min(100,w/l.whole*100):100}%"></i></span>
  ${l.looseKg?`<span class="ln"><span>${t("loose")}</span><b>${fmt(lk)} / ${fmt(l.looseKg,0)}</b></span><span class="bar ${lk>=l.looseKg-0.5?"done":""}"><i style="width:${Math.min(100,lk/l.looseKg*100)}%"></i></span>`:""}</div>`};
 const tw=X.lines.reduce((a,l)=>a+wholeDone(l.sku),0),tW=X.lines.reduce((a,l)=>a+l.whole,0),tl=X.lines.reduce((a,l)=>a+looseDoneKg(l.sku),0),tL=X.lines.reduce((a,l)=>a+l.looseKg,0);
 const lots=X.lines.map(l=>`<div class="skuhd" style="margin-top:8px">${short(l.sku)}</div>`+lotsOf(l.sku).filter(L=>fullLeft(L).length||partLeft(L).length).map(L=>`<div class="lotrow ${L.lot===curLot&&l.sku===curSku?"on":""}"><span class="l1"><b>${L.lot}</b><span><span class="num">${fullLeft(L).length}</span> ${t("bags").toLowerCase()} ${t("left")}</span></span>${partLeft(L).map(b=>`<span class="pt">${t("partial")} ${nn(b.no)}/${nn(L.exp)} · ${fmt(b.kg)} kg</span>`).join("")}</div>`).join("")).join("");
 const rows=X.batches.slice().reverse().map(b=>`<tr class="${b.pend?"pend":""}"><td class="num">#${b.id}</td><td class="num">${b.time}</td><td>${short(b.sku)}${b.split?" *":""}</td><td class="num">${[...new Set(b.bags.map(x=>x.lot))].join(", ")}</td><td class="r num">${b.type==="loose"?t("looseShort"):b.bags.length}</td><td class="r num">${fmt(b.kg)}</td><td>${b.pend?t("pending"):""}</td></tr>`).join("");
 return `<div class="crumb"><a href="#/release">‹ ${t("release")}</a><span>${X.id}</span></div>
 <div class="hd"><span class="ttl">${X.id}</span><span class="meta">${X.so} · ${X.cust} · ${fmt(slipKg(X),0)} kg</span>${pill(X.status)}<span class="sp"></span><button class="b-out" onclick="window.open('#/labels/${X.id}','_blank')">${t("stockLabels")}</button><button class="camb" onclick="camOpen()" ${xLocked()?"disabled":""}>${t("camScan")}</button><button class="b-pri" onclick="xSend()" ${xLocked()?"disabled":""}>${t("sendMgr")}</button></div>
 <div class="station"><div class="st-left">
  <div class="card scale" style="margin:0"><div class="kg"><span id="kg">${fmt(SC.kg)}</span><small>kg</small></div><div class="side" id="stab">${stableHTML()}</div>
   <div class="facts"><div class="fact"><div class="k">SKU</div><div class="v">${curSku?short(curSku):"–"}</div></div><div class="fact"><div class="k">${t("stillNeedK")}</div><div class="v big num">${needTxt}</div></div>
   ${X.mode==="whole"?`<div class="fact"><div class="k">${t("bagsInBatch")}</div><div class="v num">${n}</div></div><div class="fact"><div class="k">${t("kgPerBag")}</div><div class="v num ${xKpbOff()?"off":""}" id="kpb">${xKpb()===null?"–":fmt(xKpb(),1)}</div></div>`:""}</div></div>
  <div class="tabs" role="group"><button aria-pressed="${X.mode==="whole"}" onclick="xMode('whole')">${t("whole")} · ${tw}/${tW}</button>${tL?`<button aria-pressed="${X.mode==="loose"}" onclick="xMode('loose')">${t("loose")} · ${fmt(tl)}/${fmt(tL,0)}</button>`:""}</div>
  ${alertBox(ex)}
  ${work}
 </div><div class="st-right">
  <div class="card" style="margin:0"><h3>${t("progress")} · ${X.lines.length} SKU</h3>${X.lines.map(lineRow).join("")}</div>
  <div class="card" style="margin:0"><h3>${t("pickOrder")}</h3>${lots}</div>
  <div class="card" style="margin:0"><h3>${t("batches")} · ${X.batches.length}</h3><div style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>${t("time")}</th><th>SKU</th><th>${t("lot")}</th><th class="r">${t("bags")}</th><th class="r">kg</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <button class="b-out" style="margin-top:10px" onclick="xUndo()" ${!X.batches.length||X.batches[X.batches.length-1].pend||xLocked()?"disabled":""}>${t("undo")}</button></div>
 </div></div>`;
}
function pOther(){return `<div class="page-h">${t(VIEW.name)}</div><div class="card" style="margin-top:16px"><div class="empty">${t("notInDemo")}</div></div>`}

function render(){
 let body,title;
 if(VIEW.name==="receipt"){title=t("receiving");body=pReceipt()}
 else if(VIEW.name==="slip"){title=t("release");body=pSlip()}
 else if(VIEW.name==="release"){title=t("release");body=pRelease()}
 else if(VIEW.name==="labels"){title=t("labelsOf");body=pLabels()}
 else if(VIEW.name==="stocktakes"){title=t("stocktakes");body=pStocktakes()}
 else if(VIEW.name==="stock"){title=t("stocktakes");body=pStock()}
 else if(VIEW.name==="receiving"){title=t("receiving");body=pReceiving()}
 else{title=t(VIEW.name);body=pOther()}
 const app=document.getElementById("app"),sc=app.querySelector(".content"),y=sc?sc.scrollTop:0;
 app.innerHTML=`<div class="shell">${railHTML()}<div class="main">${topHTML(title)}<main class="content">${body}</main></div></div>${S?simHTML(VIEW.name):""}`;
 camInfo();
 const sc2=app.querySelector(".content");if(sc2)sc2.scrollTop=y;
}
function renderScale(){camInfo();const k=document.getElementById("kg");if(!k)return;k.textContent=fmt(SC.kg);const p=document.getElementById("kpb");if(p&&S){const v=VIEW.name==="receipt"?rKpb():VIEW.name==="stock"?null:xKpb();p.textContent=v===null?"–":fmt(v,1)}}
document.documentElement.lang=LANG;
route();
</script>
